
<div>
    <div ng-if="vm.btnDisable==false">
        <label ng-class="vm.cls" for="{{vm.name}}">
            {{vm.btntype}}
        </label>
        <input class="checkbox style-2 pull-right" type="checkbox" ng-click="vm.onClick()"
               aria-required="{{vm.isReq}}"
               ng-checked="vm.btnChecked" name="{{vm.name}}" id="{{vm.name}}" ng-model="vm.btnChecked"
               data-shaam-input-custom-validation-error-message="vm.customValidationErrorMessage"
               data-shaam-input-custom-validation="vm.customValidationCallBack({value:value})"
               data-shaam-input-custom-validation-name="{{vm.customValidationName}}"
               group-validation="vm.groupValidation" />


    </div>

    <div ng-if="vm.btnDisable==true">
        <label ng-class="vm.cls" for="{{vm.name}}">
            {{vm.btntype}}
        </label>

        <input class="checkbox style-2 pull-right" type="checkbox" disabled="disabled" ng-checked={{vm.btnChecked}} ng-model="vm.value"
               name="{{vm.name}}" id="{{vm.name}}"
               aria-required="{{vm.isReq}}"
               data-shaam-input-custom-validation-error-message="vm.customValidationErrorMessage"
               data-shaam-input-custom-validation="vm.customValidationCallBack({value:value})"
               data-shaam-input-custom-validation-name="{{vm.customValidationName}}"
               group-validation="vm.groupValidation" />
        

    </div>
</div>
