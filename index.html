<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- כל דף ציבורי נושא טוקן ב-URL (?portal=/?intake=/?sign=/וכו'). קישור
         חיצוני מהדף (וואטסאפ, אתר המשרד) היה מדליף אותו ב-Referer בלי זה. -->
    <meta name="referrer" content="no-referrer" />
    <title>PIVO · גיא ישר · רואה חשבון</title>
    <meta name="theme-color" content="#f8f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131619" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Space+Mono:wght@400;700&family=Secular+One&display=swap" rel="stylesheet" />
    <script>
      // קובע את הערכה עוד לפני שהאפליקציה נטענת, כדי שלא יהיה הבזק לבן
      (function () {
        try {
          var saved = localStorage.getItem('pivo_theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) { /* אין גישה לאחסון — נשארים בברירת המחדל הבהירה */ }
      })();
    </script>
    <style>
      /* ‼ 25.10.2026 · מופיע מיד, לפני שהקוד ירד — לא מסך לבן ריק. React מחליף אותו כשהוא עולה. */
      .boot-loading { min-height: 60vh; display: flex; align-items: center; justify-content: center; gap: 10px;
        font: 500 15px/1.4 Heebo, system-ui, sans-serif; color: #6b7280; }
      .boot-loading::before { content: ''; width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid currentColor; border-top-color: transparent; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-loading::before { animation: none; } }
      [data-theme="dark"] body { background: #131619; }
      [data-theme="dark"] .boot-loading { color: #9aa3ad; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loading" role="status">טוען…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
