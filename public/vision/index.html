<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- מפת הדרך לעצמאות · הלשונית «מפת הדרך» ב-PIVO מציגה את הדף הזה במסגרת ושומרת ב-vision_docs (227).
     הסבר מלא: docs/vision/README.md -->
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>מפת הדרך לעצמאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=Manrope:wght@600&display=swap">
<style>
/* דף אחד לחזור אליו כשצריך להתמקד. עמודה אחת: הלמה, השבוע (הכרטיס היחיד שמורם),
   שתי העצמאויות זו לצד זו, הדרך והיומן. כל השאר יושב על הדף בשקט. הטוקנים של PIVO. */
:root{
  color-scheme:light;
  --page:#f8f7f5; --surface:#ffffff; --sunk:#f2f1ee; --hair:#ebe9e5; --line:#e2e4e7; --line-strong:#d3d6da;
  --ink:#25282d; --ink-2:#4b5058; --ink-3:#656a71; --ink-4:#8e949b; --quiet:#c3c7cc;
  --accent:#3f5f8f; --accent-strong:#34507a; --accent-soft:#e8eef5; --accent-line:#c6d4e6;
  --fill:#3f5f8f; --fill-hover:#34507a; --on-fill:#ffffff;
  --done:#34a06a; --done-ink:#24654e; --done-soft:#eaf4ef; --done-line:#c2ddcf;
  --danger:#a8432f;
  --brick:#3f5f8f; --brick-tx:#ffffff; --brick-co:#26406a; --brick-co-tx:#ffffff;
  --brick-pend:#e8eef5; --brick-pend-line:#b9cbe3; --brick-pend-tx:#3f5f8f;
  --brick-gone:#ecebe8; --brick-gone-tx:#63686f; --slot:#c9ccd1;
  --r0:#93abd0; --r1:#7591bf; --r2:#5877ab; --r3:#3f5f8f;
  --ring-track:#ecebe8; --stem:#d6d8dc;
  --scrim:rgba(20,22,26,.42);
  --shadow:0 1px 2px rgba(28,30,34,.04),0 8px 22px -12px rgba(28,30,34,.18);
  --shadow-lg:0 18px 40px -24px rgba(28,30,34,.35),0 4px 10px -6px rgba(28,30,34,.1);
  --lift:0 14px 26px -12px rgba(28,30,34,.45);
  --focus:rgba(63,95,143,.45); --glow:rgba(63,95,143,.28);
  --font:'Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Frank Ruhl Libre','David Libre',Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.45,.5,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#141416; --surface:#1b1b1e; --sunk:#202024; --hair:#27272c; --line:#33333a; --line-strong:#41414a;
    --ink:#ededef; --ink-2:#c9c9cf; --ink-3:#a3a3ab; --ink-4:#7e7e86; --quiet:#4c4c54;
    --accent:#9ab6e6; --accent-strong:#b4c9ee; --accent-soft:#1e2734; --accent-line:#35455c;
    --fill:#3a6fc4; --fill-hover:#4a7fd3; --on-fill:#ffffff;
    --done:#57b98c; --done-ink:#63c79c; --done-soft:#152c25; --done-line:#26443a;
    --danger:#e0806b;
    --brick:#3a6fc4; --brick-tx:#ffffff; --brick-co:#9ab6e6; --brick-co-tx:#0e0e10;
    --brick-pend:#1e2734; --brick-pend-line:#35455c; --brick-pend-tx:#9ab6e6;
    --brick-gone:#26262b; --brick-gone-tx:#9c9ca4; --slot:#4c4c54;
    --r0:#34507a; --r1:#4a6ea6; --r2:#6489c4; --r3:#7fa2da;
    --ring-track:#2c2c31; --stem:#41414a;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7);
    --shadow-lg:0 18px 40px -24px rgba(0,0,0,.8),0 4px 10px -6px rgba(0,0,0,.5);
    --lift:0 14px 26px -12px rgba(0,0,0,.8);
    --focus:rgba(154,182,230,.45); --glow:rgba(154,182,230,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#141416; --surface:#1b1b1e; --sunk:#202024; --hair:#27272c; --line:#33333a; --line-strong:#41414a;
  --ink:#ededef; --ink-2:#c9c9cf; --ink-3:#a3a3ab; --ink-4:#7e7e86; --quiet:#4c4c54;
  --accent:#9ab6e6; --accent-strong:#b4c9ee; --accent-soft:#1e2734; --accent-line:#35455c;
  --fill:#3a6fc4; --fill-hover:#4a7fd3; --on-fill:#ffffff;
  --done:#57b98c; --done-ink:#63c79c; --done-soft:#152c25; --done-line:#26443a;
  --danger:#e0806b;
  --brick:#3a6fc4; --brick-tx:#ffffff; --brick-co:#9ab6e6; --brick-co-tx:#0e0e10;
  --brick-pend:#1e2734; --brick-pend-line:#35455c; --brick-pend-tx:#9ab6e6;
  --brick-gone:#26262b; --brick-gone-tx:#9c9ca4; --slot:#4c4c54;
  --r0:#34507a; --r1:#4a6ea6; --r2:#6489c4; --r3:#7fa2da;
  --ring-track:#2c2c31; --stem:#41414a;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7);
  --shadow-lg:0 18px 40px -24px rgba(0,0,0,.8),0 4px 10px -6px rgba(0,0,0,.5);
  --lift:0 14px 26px -12px rgba(0,0,0,.8);
  --focus:rgba(154,182,230,.45); --glow:rgba(154,182,230,.3);
}

*,*::before,*::after{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:where(a,button,input,textarea,select,summary,[tabindex],[contenteditable]):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-3)}

.wrap{max-width:1080px;margin-inline:auto;padding-inline:28px;padding-block:30px 64px;display:grid;gap:60px}
@media (max-width:640px){.wrap{padding-inline:16px;padding-block:20px 48px;gap:44px}}

/* ── יסודות ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.btn.primary:hover{background:var(--fill-hover);border-color:var(--fill-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--sunk)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn .ico{width:15px;height:15px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:inherit;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent-line)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-3);flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn.quiet{border-color:transparent;background:transparent;color:var(--ink-4)}
.iconbtn.quiet:hover{color:var(--ink);background:var(--sunk)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--done-soft);border-color:var(--done-line);color:var(--done-ink)}
.chip.br{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip .ico{width:12px;height:12px;stroke-width:2}
.check{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--ink-2);user-select:none}
.check input{appearance:none;-webkit-appearance:none;width:19px;height:19px;margin:0;border:1.5px solid var(--quiet);border-radius:5px;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,border-color .15s}
.check input:checked{background:var(--done);border-color:var(--done);animation:tick .35s var(--spring)}
.check input:checked::after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
@keyframes tick{0%{transform:scale(.7)}100%{transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes rowflash{0%{background:var(--accent-soft)}100%{background:transparent}}

.sec{display:grid;gap:20px;min-width:0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.sec-head > div{min-width:0}
.sec-title{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.15;color:var(--ink);text-wrap:balance}
.sec-sub{font-size:14px;color:var(--ink-3);margin-top:5px;max-width:62ch}

/* דוגמה */
.banner{display:flex;align-items:center;justify-content:center;gap:8px 16px;flex-wrap:wrap;padding:11px 16px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line);font-size:14px;color:var(--ink-2);text-align:center}
.banner b{color:var(--ink);font-weight:600}

/* ── 1. הלמה ────────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 56px;align-items:center}
.hero-text{min-width:0;position:relative}
.eyebrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.brand{display:inline-flex;align-items:center;gap:6px;color:var(--accent);direction:ltr}
.brand svg{width:18px;height:18px}
.brand span{font-family:'Manrope',var(--font);font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.02em}
.eyebrow .sep{color:var(--quiet)}
.title{font-family:var(--serif);font-weight:700;font-size:50px;line-height:1.05;letter-spacing:-.01em;margin-top:16px;text-wrap:balance}
.why{font-family:var(--serif);font-size:24px;line-height:1.45;color:var(--ink-2);max-width:32ch;text-wrap:pretty;margin-top:14px;border-radius:6px;outline-offset:6px;cursor:text}
.why:hover{background:var(--sunk)}
.why:empty::before{content:'למה אתה עושה את כל זה? כתוב כאן משפט אחד.';color:var(--ink-4)}
.why-hint{position:absolute;inset-inline-start:0;top:100%;font-size:12.5px;color:var(--ink-3);margin-top:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.hero-text:hover .why-hint,.why:focus + .why-hint{opacity:1}
.horizon{display:flex;align-items:center;gap:18px}
.spiral-svg{width:168px;height:168px;display:block;overflow:visible}
.sp-plan{fill:none;stroke:var(--ink-4);stroke-width:1.3;stroke-linecap:round}
.sp-dream{fill:none;stroke:var(--quiet);stroke-width:1.1;stroke-linecap:round}
.sp-past{fill:none;stroke:var(--fill);stroke-width:2.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.sp-flow{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.035 .965;stroke-dashoffset:.04;opacity:0;animation:flow 12s cubic-bezier(.45,0,.4,1) 2.4s infinite}
@keyframes flow{0%{stroke-dashoffset:.04;opacity:0}5%{opacity:.85}60%{opacity:.85}68%{stroke-dashoffset:-.97;opacity:0}100%{stroke-dashoffset:-.97;opacity:0}}
.anim .sp-past{animation:draw 1.6s var(--ease) .15s both}
.anim .sp-plan,.anim .sp-dream{animation:fadeIn 1s ease .9s both}
.sp-star{fill:var(--accent)}
.sp-star.twinkle{animation:twinkle 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sp-star.late{animation-delay:1.8s}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
.sp-now{fill:var(--fill)}
.sp-now-halo{fill:none;stroke:var(--fill);stroke-width:1.5;opacity:.5;transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.1);opacity:0}}
.legend3{display:grid;gap:8px;font-size:13px;color:var(--ink-3)}
.legend3 li{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend3 .lg-h{margin-top:6px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.l-now{width:9px;height:9px;border-radius:50%;background:var(--fill);flex:none}
.l-star{width:11px;height:11px;fill:var(--accent);flex:none}
@media (max-width:860px){.hero{grid-template-columns:1fr}.horizon{justify-content:flex-start}}
@media (max-width:640px){.title{font-size:40px}.why{font-size:21px}.spiral-svg{width:124px;height:124px}.horizon{gap:14px}.legend3{font-size:12px}}

/* ── 2. השבוע: הכרטיס היחיד שמורם ─────────────────────────── */
.week{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px 28px 22px;display:grid;gap:20px;min-width:0}
@media (max-width:640px){.week{padding:18px 18px 16px;border-radius:16px;gap:16px}}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.wk-label{font-size:14px;color:var(--ink-3)}
.wk-label b{color:var(--ink);font-weight:600}
.wk-sum{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:14px;color:var(--ink-3)}
.wk-sum .ico{color:var(--done)}
.nb{display:inline-block;vertical-align:-1px;margin-inline-end:8px;width:15px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--brick-pend-line) 0 1.5px,var(--brick-pend) 1.5px 5px);box-shadow:inset 0 0 0 1px var(--brick-pend-line);flex:none}
.loading{font-size:13px;color:var(--ink-3)}
.one{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}
.one-box{position:relative;width:34px;height:34px;margin-top:24px;cursor:pointer}
.one-box input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.one-box i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;background:var(--surface);transition:background .2s,border-color .2s}
.one-box i .ico{width:17px;height:17px;stroke-width:2.6}
.one-box:hover i{border-color:var(--accent)}
.one-box input:focus-visible + i{outline:2px solid var(--focus);outline-offset:3px}
.one-box input:checked + i{background:var(--done);border-color:var(--done);color:#fff;animation:tick .35s var(--spring)}
.one-label{font-size:13px;color:var(--ink-3);font-weight:500}
.one-text{font-size:23px;line-height:1.4;font-weight:500;color:var(--ink);margin-top:4px;text-wrap:pretty}
.one-text .day{color:var(--accent);font-weight:600}
.one.done .one-text,.one.done .one-text .day{color:var(--ink-3)}
.one-done{font-size:14px;color:var(--done-ink);font-weight:500;margin-top:4px}
.one-form{display:grid;gap:8px}
.one-help{margin:-4px 0 2px;font-size:13px;color:var(--ink-4);line-height:1.45}
.one-row{display:flex;gap:8px;flex-wrap:wrap}
.one-row input{flex:1 1 260px;min-width:0;height:46px;padding:0 14px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);color:var(--ink);font-size:17px}
.one-row select{height:46px;padding:0 10px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);color:var(--ink)}
.one-row .btn{height:46px}
.month-act{font-size:14px;color:var(--ink-3);margin-top:8px;text-wrap:pretty}
.month-act b{color:var(--ink-2);font-weight:500}
.zones{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 48px;padding-top:18px;border-top:1px solid var(--hair)}
.zone-h{display:grid;gap:1px;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.zone-h b{font-weight:500;color:var(--ink-2);font-size:13.5px}
.zone-h span{text-wrap:pretty}
.ctl{display:grid;align-content:start;gap:0}
.won{display:grid;grid-template-columns:8.5em minmax(0,1fr);align-items:baseline;gap:2px 8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font-size:14px;color:var(--ink-2)}
.won-l{font-weight:500}
.won-v{color:var(--ink-3)}
.won-v b{font-size:16px;font-weight:600;color:var(--ink-2)}
.won.has .won-v b{color:var(--done-ink)}
.won-names{grid-column:2;font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.ctr{display:grid;grid-template-columns:8.5em auto auto;justify-content:start;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.notes{display:grid;align-content:start;gap:6px;min-width:0}
.nlist{display:grid}
.nlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;font-size:14px;line-height:1.45;color:var(--ink)}
.nlist li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:12px}
.nlist li.fresh{animation:rowflash 1.6s ease-out;border-radius:6px}
.nlist span{min-width:0;overflow-wrap:anywhere;padding-block:4px}
.nx{width:28px;height:28px;padding:0;border:0;border-radius:7px;background:none;color:var(--ink-4);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s}
.nx .ico{width:13px;height:13px}
.nlist li:hover .nx,.nx:focus-visible{opacity:1}
.nx:hover{background:var(--sunk);color:var(--ink)}
@media (hover:none){.nx{opacity:1}}
.nmore{justify-self:start;font-size:13px}
.nform{display:flex;gap:6px}
.nform input{flex:1 1 auto;min-width:0;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font-size:14px;transition:background .15s,border-color .15s}
.nform input::placeholder{color:var(--ink-3)}
.nform input:focus{background:var(--surface);border-color:var(--line-strong)}
.nform .btn{height:38px}
@media (max-width:760px){.zones{grid-template-columns:minmax(0,1fr)}.zones > .ctl{padding-top:18px;border-top:1px solid var(--hair)}}
.ctr-l{font-weight:500;margin-inline-end:2px}
.pips{display:inline-flex;min-width:60px}
.pip{width:20px;height:30px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:6px}
.pip i{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--quiet);transition:background .2s,border-color .2s}
.pip:hover i{border-color:var(--accent)}
.pip.on i{background:var(--fill);border-color:var(--fill)}
.ctr.hit .pip.on i{background:var(--done);border-color:var(--done)}
.pip.pop i{animation:popin .45s var(--spring)}
.ctr-add{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.ctr-add:hover{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.ctr-add:active{transform:scale(.92)}
.ctr-add .ico{width:13px;height:13px;stroke-width:2.2}
@media (max-width:640px){
  .ctr-add{width:34px;height:34px}.pip{width:24px;height:36px}.pips{min-width:72px}.one-text{font-size:20px}.one-box{margin-top:22px}
  .ctl{gap:4px}
  .nform input{height:42px;font-size:16px}.nform .btn{height:42px}
}

/* ── 3. שתי העצמאויות ───────────────────────────────────── */
.tracks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.track{display:flex;flex-direction:column;gap:18px;min-width:0;padding-inline-end:40px}
.track + .track{padding-inline:40px 0;border-inline-start:1px solid var(--hair)}
@media (max-width:980px){.tracks{grid-template-columns:1fr;gap:60px}.track,.track + .track{padding-inline:0;border-inline-start:0}}
/* רשימת התהליכים ארוכה מהקיר: הקיר נשאר מול העיניים בזמן שגוללים בה */
@media (min-width:981px){#money{align-self:start;position:sticky;top:20px}}
.big{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.big-num{font-size:48px;font-weight:600;letter-spacing:-.025em;line-height:1;color:var(--ink)}
.big-cur{font-size:24px;font-weight:500;color:var(--ink-3)}
.big-unit{font-size:16px;color:var(--ink-3)}
@media (max-width:420px){.big-num{font-size:42px}}
.pace{font-size:14px;color:var(--ink-2);line-height:1.6}
.pace b{color:var(--ink);font-weight:600}

/* הקיר */
.wall-stage{position:relative;padding-top:6px}
.wall-stage.has-float{padding-top:84px}
.wall{display:flex;flex-direction:column;align-items:center;gap:4px;--u:84px}
.course-label{align-self:stretch;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);margin-block:0 8px}
.course-label::after{content:'';flex:1;height:1px;background:var(--hair)}
.course-label b{color:var(--ink);font-weight:600}
.brow{display:flex;gap:4px;justify-content:center}
.brick{width:var(--u);height:46px;border-radius:5px;border:0;padding:0 4px;background:var(--brick);color:var(--brick-tx);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-size:12.5px;position:relative;cursor:pointer;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.12);transition:transform .18s var(--ease),box-shadow .18s}
.brick .bn{font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.brick .ba{opacity:.86;font-variant-numeric:tabular-nums;white-space:nowrap}
.brick.co{width:calc(var(--u) * 2 + 4px);background:var(--brick-co);color:var(--brick-co-tx)}
.brick.pend{background:repeating-linear-gradient(135deg,var(--brick-pend-line) 0 1.5px,var(--brick-pend) 1.5px 6px);color:var(--brick-pend-tx);box-shadow:inset 0 0 0 1px var(--brick-pend-line)}
.brick.gone{background:var(--brick-gone);color:var(--brick-gone-tx)}
.brick.gone .bn{text-decoration:line-through;text-decoration-thickness:1px}
.brick.slot{background:transparent;box-shadow:none;border:1.5px dashed var(--slot);color:var(--ink-3);font-weight:500;cursor:default}
.brick.slot.target{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);animation:targetPulse 1.8s ease-in-out infinite}
.wall.drop-ready .brick.slot.target{background:var(--accent-line);animation:none;transform:scale(1.04)}
@keyframes targetPulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 5px var(--glow)}}
.brick:not(.slot):hover,.brick:not(.slot):focus-visible{transform:translateY(-2px);box-shadow:var(--lift)}
.brick.build{animation:build .5s var(--spring) both;animation-delay:var(--d,0ms)}
@keyframes build{0%{transform:translateY(-22px);opacity:0}100%{transform:none;opacity:1}}
.later{font-size:13px;color:var(--ink-3);margin:0 0 8px}
.mini-course{display:flex;align-items:center;gap:10px;align-self:stretch;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.mc-bricks{display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0}
.mb{display:inline-block;width:14px;height:9px;border-radius:2px;background:var(--brick)}
.mb.co{width:30px;background:var(--brick-co)}
.mb.gone{background:var(--brick-gone);box-shadow:inset 0 0 0 1px var(--line)}
.foundation{align-self:stretch;margin-top:6px;height:3px;border-radius:2px;background:var(--hair)}
.wall-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.wall-legend:empty{display:none}
.wall-legend span{display:inline-flex;align-items:center;gap:6px}
.wall-legend i{width:16px;height:10px;border-radius:2px;flex:none}
.wall-empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 16px 18px;margin-bottom:12px;border-radius:14px;border:1.5px dashed var(--accent-line);background:var(--accent-soft);font-size:14px;color:var(--ink-2)}
.float-brick{position:absolute;top:10px;left:50%;z-index:6;cursor:grab;touch-action:none;transform:translateX(-50%);animation:bob 2.8s ease-in-out infinite;border:0;padding:0;background:none}
.float-brick .brick{box-shadow:var(--lift);cursor:grab}
.float-brick.dragging{animation:none;cursor:grabbing;transition:none}
.float-brick.dragging .brick{cursor:grabbing;box-shadow:0 22px 34px -14px rgba(28,30,34,.55)}
.float-hint{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--accent);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.float-brick.dragging + .float-hint{opacity:0}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.dust{position:fixed;z-index:80;width:6px;height:6px;border-radius:50%;background:var(--line-strong);pointer-events:none;animation:dust .7s var(--ease) forwards}
@keyframes dust{0%{transform:translate(0,0) scale(1);opacity:.9}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* המעגל */
.ring-wrap{position:relative;display:flex;justify-content:center}
.ring-svg{display:block;width:100%;max-width:470px;overflow:visible;user-select:none;-webkit-user-select:none}
@media (pointer:fine){.ring-svg{touch-action:none}}
.ring-svg.dragging{cursor:grabbing}
.r-track{fill:none;stroke:var(--ring-track);stroke-width:16;transition:stroke .2s}
.r-fill{fill:none;stroke:var(--fill);stroke-width:16;stroke-dasharray:1;stroke-dashoffset:0}
.r-fill.done{stroke:var(--done)}
.r-hit{fill:none;stroke:transparent;stroke-width:96;pointer-events:stroke;cursor:pointer}
.st{cursor:pointer;outline:none}
.st .r-name{fill:var(--ink);font-weight:600}
.st:hover .r-track,.st.drop .r-track{stroke:var(--accent-line)}
.st.drop .r-name{fill:var(--accent)}
.st:focus-visible .r-track{stroke:var(--focus)}
.r-arrow{fill:var(--ink-4)}
.stem{fill:none;stroke:var(--stem);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.bud-g{cursor:grab;outline:none}
.bud-g.dragging{cursor:grabbing}
.bud-hit{fill:transparent}
.bud{stroke-width:1.6;transition:fill .3s,stroke .3s;transform-box:fill-box;transform-origin:center}
.bud.r0{fill:var(--surface);stroke:var(--r0)}
.bud.r1,.bud.r2,.bud.r3{fill:var(--fill);stroke:var(--fill)}
.bud.r4{fill:var(--done);stroke:var(--done)}
.bud-g:hover .bud,.bud-g:focus-visible .bud{transform:scale(1.25)}
.bud-g:focus-visible .bud{stroke:var(--ink);stroke-width:2}
.anim .r-fill{animation:draw 1s var(--ease) both;animation-delay:var(--d,0ms)}
.anim .stem,.stem.fresh{animation:draw .45s var(--ease) both;animation-delay:var(--d,0ms)}
.anim .bud,.bud.fresh{animation:popin .5s var(--spring) both;animation-delay:var(--d,0ms)}
.bud.bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}
.core{fill:var(--surface);stroke:var(--line)}
.core-arc{fill:none;stroke:var(--fill);stroke-width:3;stroke-linecap:round}
.core-arc.done{stroke:var(--done)}
.core-track{fill:none;stroke:var(--ring-track);stroke-width:3}
.core-mark{fill:none;stroke:var(--accent);stroke-width:8.5;stroke-linecap:round}
.core-label{fill:var(--ink);font-weight:600}
.st.office:hover .core,.st.office.drop .core{stroke:var(--accent)}
.seed-g{cursor:grab;outline:none}
.seed-g:focus-visible .seed-halo{stroke:var(--ink);stroke-width:2}
.seed{fill:var(--fill);stroke:var(--surface);stroke-width:2}
.seed-halo{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 3;transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.seed-g.idle{animation:seedbob 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes seedbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.rkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-3);justify-content:center}
.rkey span{display:inline-flex;align-items:center;gap:5px}
.rkey i{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}
.capture{display:flex;gap:8px;flex-wrap:wrap}
.capture input{flex:1 1 220px;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink)}
.capture input::placeholder{color:var(--ink-4)}
.placer{display:grid;gap:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px dashed var(--accent-line)}
.placer-text{font-size:14px;color:var(--ink-2)}
.placer-text b{color:var(--ink)}
.st-chips{display:flex;flex-wrap:wrap;gap:6px}
.st-chips button{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);font-size:13px;font-weight:500;cursor:pointer}
.st-chips button:hover{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.st-chips button.quiet{border-style:dashed;color:var(--ink-3)}
.st-chips .ico{width:12px;height:12px;stroke-width:2.2}

/* הצומת: יריעת צד */
.sheet-scrim{position:fixed;inset:0;z-index:110;background:var(--scrim);animation:fadeIn .2s ease}
.sheet{position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:111;width:min(480px,100%);background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .32s var(--ease)}
@keyframes slideIn{from{transform:translateX(-28px);opacity:0}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 24px 16px;border-bottom:1px solid var(--hair)}
.sh-id{display:flex;gap:14px;align-items:center;min-width:0}
.sh-head h2{font-size:26px;font-weight:700;font-family:var(--serif);line-height:1.15;margin-top:2px}
.sh-head .sec-sub{font-size:13px}
.mini-ring{width:58px;height:58px;flex:none;overflow:visible}
.mr-arc{fill:none;stroke:var(--ring-track);stroke-width:6}
.mr-arc.on{stroke:var(--accent-line)}
.mr-fill{fill:none;stroke:var(--fill);stroke-width:6;stroke-dasharray:1;stroke-dashoffset:0}
.mr-fill.done{stroke:var(--done)}
.anim .mr-fill{animation:draw .8s var(--ease) .15s both}
.mr-core{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.mr-core.on{fill:var(--accent-soft);stroke:var(--fill);stroke-width:2.5}
.mr-pin{fill:var(--fill)}
.sh-body{flex:1;overflow:auto;padding:16px 24px 28px;display:grid;gap:18px;align-content:start}
.sh-stats{display:flex;flex-wrap:wrap;gap:6px}
.plist{display:grid}
/* ריכוז כל התהליכים: התחנות לפי הסדר, וכל תהליך גלוי */
.pmap{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.sys-top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.sys-top .big{flex-direction:column;align-items:flex-start;gap:6px;max-width:12em}
.cyc{width:254px;height:200px;flex:none;max-width:100%}
.cyc-st{cursor:pointer;outline:none}
.cyc-hit{fill:none;stroke:transparent;stroke-width:34}
.cyc-track{fill:none;stroke:var(--ring-track);stroke-width:13;stroke-linecap:butt;transition:stroke .2s}
.cyc-seg{fill:none;stroke-width:13;cursor:pointer;transition:stroke-width .15s}
.cyc-seg.core{stroke-width:6}
.cyc-seg:hover{stroke-width:17}.cyc-seg.core:hover{stroke-width:9}
.cyc-seg.r0{stroke:var(--r0)}.cyc-seg.r1{stroke:var(--r1)}.cyc-seg.r2{stroke:var(--r2)}.cyc-seg.r3{stroke:var(--r3)}.cyc-seg.r4{stroke:var(--done)}
.cyc-st:hover .cyc-track,.cyc-st:focus-visible .cyc-track{stroke:var(--accent-line)}
.cyc-name{font-size:13px;font-weight:600;fill:var(--ink-2)}
.cyc-arrow{fill:var(--ink-4)}
.cyc-core{fill:var(--surface);stroke:var(--ring-track);stroke-width:5}
.cyc-core-arc{fill:none;stroke:var(--fill);stroke-width:5}
.cyc-core-arc.done{stroke:var(--done)}
.cyc-core-t{font-size:12px;fill:var(--ink-3)}
@media (max-width:640px){.cyc{width:240px;height:189px;margin-inline:auto}}
.pst{display:grid;gap:2px;padding:12px 0 8px;border-top:1px solid var(--hair);border-radius:4px}
.pst:first-child{border-top:0;padding-top:4px}
.pst.flash{animation:rowflash 1.6s ease-out}
.pst-h{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;align-items:center;gap:10px}
.pst-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);font-variant-numeric:tabular-nums}
.pst.done .pst-n{color:var(--done-ink);background:var(--done-soft)}
.pst.office .pst-n{background:none;box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.pst-name{margin:0;font-size:16px;font-weight:600;color:var(--ink);line-height:1.3}
.pst-stat{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.pst.done .pst-stat{color:var(--done-ink)}
.pst-add{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.pst-add:hover,.pst-add[aria-expanded="true"]{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.pst-add .ico{width:13px;height:13px;stroke-width:2.2}
.pst .plist{padding-inline-start:34px}
.pst .prow{padding:7px 0}
.pst-empty{margin:0;padding-inline-start:34px;font-size:13.5px;color:var(--ink-4);line-height:1.5;text-wrap:pretty}
.pst-form,.pst .ideas{margin:6px 0 4px;padding-inline-start:34px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--hair)}
.prow:first-child{border-top:0}
.prow.bump{animation:rowflash 1.2s ease-out}
.steps{display:inline-flex;gap:3px}
.steps i{width:11px;height:8px;border-radius:2px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);transition:background .3s}
.pname{border:0;background:none;padding:0;text-align:start;cursor:pointer;color:var(--ink);font-size:15px;line-height:1.4}
.pname:hover{color:var(--accent)}
.plevel{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.psave{font-size:12.5px;color:var(--done-ink);font-weight:500;white-space:nowrap}
.climb{width:30px;height:30px;border-radius:9px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,transform .15s}
.climb:hover{background:var(--accent-line);transform:translateY(-1px)}
.climb .ico{width:14px;height:14px;stroke-width:2}
.topmark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--done-ink);background:var(--done-soft);flex:none}
.topmark .ico{width:14px;height:14px;stroke-width:2.2}
.empty{font-size:14px;color:var(--ink-3);padding:14px;border-radius:12px;background:var(--sunk)}
.ideas{display:grid;gap:8px}
.ideas-t{font-size:13px;color:var(--ink-3)}

/* ── 4. הדרך ────────────────────────────────────────────── */
.road{display:grid}
details.phase{position:relative;padding-inline-start:38px}
details.phase::before{content:'';position:absolute;inset-inline-start:10px;top:0;bottom:0;width:2px;background:var(--line)}
details.phase:first-child::before{top:27px}
details.phase:last-child::before{bottom:auto;height:27px;background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px)}
details.phase.done::before{background:var(--done-line)}
.ph-mark{position:absolute;inset-inline-start:3px;top:19px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);background:var(--page);display:grid;place-items:center;color:#fff;z-index:1}
.ph-mark.now{border-color:var(--fill);background:var(--fill);box-shadow:0 0 0 5px var(--accent-soft)}

.ph-mark .ico{width:10px;height:10px;stroke-width:2.8}
details.phase > summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:15px 0;cursor:pointer}
details.phase > summary::-webkit-details-marker{display:none}
.ph-num{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1;color:var(--ink);min-width:64px;padding-top:3px}
.ph-now{display:block;font-size:13px;color:var(--accent);font-weight:500;margin-top:2px}
.ph-name{font-size:16px;font-weight:600}
.ph-dates{font-size:13px;color:var(--ink-3)}
.ph-end{display:inline-flex;align-items:center;gap:10px}
.chev{width:16px;height:16px;color:var(--ink-4);transition:transform .25s var(--ease)}
details[open] > summary .chev{transform:rotate(-90deg)}
.ph-body{display:grid;gap:12px;padding:0 0 20px}
.ph-desc{font-size:14px;color:var(--ink-2);line-height:1.6;max-width:68ch}
.mslist{display:grid}
.ms{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;padding:12px 0;border-top:1px solid var(--hair)}
.ms:first-child{border-top:0;padding-top:2px}
.ms-title{font-size:15px;font-weight:500;color:var(--ink);line-height:1.45}
.ms.done .ms-title{color:var(--ink-3)}
.ms-metric{font-size:13px;color:var(--ink-3);margin-top:2px}
.ms-prog{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ms-subs{display:grid;gap:6px;margin-top:10px}
.ms-subs .check{font-size:13px;color:var(--ink-2)}
.ms-due{text-align:start;font-size:13px;color:var(--ink-3);white-space:nowrap;padding-top:2px}
.autoico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-3)}
.autoico .ico{width:13px;height:13px;stroke-width:1.8}
.autoico.done{background:var(--done);color:#fff}
@media (max-width:700px){.ms{grid-template-columns:auto 1fr}.ms-due{grid-column:2}}

/* ── 5. היומן: שורה אחת לכל שבוע, הפרטים בלחיצה ─────────── */
.journal{display:grid}
.jm{display:flex;align-items:baseline;justify-content:space-between;gap:2px 16px;flex-wrap:wrap;padding:28px 4px 10px;border-bottom:1px solid var(--line)}
.jm:first-child{padding-top:6px}
.jm-name{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink)}
.jm-money{font-size:13.5px;color:var(--ink-3)}
.jm-money b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.jw{border-bottom:1px solid var(--hair)}
.jw.flash > .jrow{animation:rowflash 1.8s ease-out}
.jrow{width:100%;display:grid;grid-template-columns:9.5em minmax(0,1fr) auto 20px;gap:4px 20px;align-items:baseline;padding:14px 6px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;text-align:start}
button.jrow{cursor:pointer;transition:background .15s}
button.jrow:hover{background:var(--sunk)}
.jdate{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.jtext{min-width:0;font-size:15px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}

function spiralSVG() {
  const S0 = 176, c = 88, r0 = 7, r1 = 80, turns = 4.25, months = 51, t0 = mIdx('2026-10');
  const tOf = (m, frac = 1) => Math.max(0, Math.min(1, (m - t0 + frac) / months));
  const tNow = tOf(V.mNow, parse(V.asOf).getUTCDate() / dim(V.mNow)), tPlan = tOf(M_DEC27);
  const pt = t => { const a = t * turns * 2 * Math.PI, r = r0 + (r1 - r0) * t; return [c + r * Math.sin(a), c - r * Math.cos(a)]; };
  const path = (ta, tb) => { let d = ''; const N = Math.max(2, Math.round((tb - ta) * 460)); for (let i = 0; i <= N; i++) { const [x, y] = pt(ta + (tb - ta) * i / N); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1); } return d; };
  const star = (m, late, label) => { const [x, y] = pt(tOf(m)); return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><path class="sp-star twinkle${late ? ' late' : ''}" d="${STAR_PATH}"><title>${label}</title></path></g>`; };
  const [nx, ny] = pt(tNow);

    <path class="sp-plan" d="${path(tNow, Math.max(tNow, tPlan))}"/>

    <path class="sp-flow" pathLength="1" d="${path(tNow, 1)}"/>
    <path class="sp-past" pathLength="1" d="${path(0, Math.max(tNow, .004))}"/>
    ${star(mIdx('2028-12'), false, 'סוף 2028 · ₪60,000 בחודש')}${star(mIdx('2030-12'), true, '2030 · ₪1,000,000 בחודש')}
    <circle class="sp-now-halo" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="6"/><circle class="sp-now" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="4"/>
  </svg>`;
}

function plannedSlotMonth(year, n, co) {
  if (co) return year === 2026 ? M_DEC26 : mIdx(['2027-03', '2027-06', '2027-09', '2027-12'][n - 1]);
  if (year === 2026) return n <= 2 ? M_SEP26 : mIdx('2026-10') + Math.floor((n - 3) / 2);
  return mIdx('2027-01') + Math.floor((n - 1) / 2);
}
function courseOf(y) {
  const bricks = V.laid.filter(c => +c.approved.slice(0, 4) === y).sort((a, b) => a.approved.localeCompare(b.approved));
  const items = bricks.map(c => ({c}));
  const Gy = GOALS[y];
  const nI = bricks.filter(c => c.type !== 'company').length, nC = bricks.filter(c => c.type === 'company').length;
  let later = 0;
  if (Gy && y === Math.min(2027, Math.max(2026, V.year)) && y >= V.year) {
    const slots = [];
    for (let n = nI + 1; n <= Gy.tI; n++) slots.push({slot: true, co: false, m: plannedSlotMonth(y, n, false)});
    for (let n = nC + 1; n <= Gy.tC; n++) slots.push({slot: true, co: true, m: plannedSlotMonth(y, n, true)});
    slots.sort((a, b) => a.m - b.m || (a.co - b.co));

    const near = slots.filter(x => x.m <= V.mNow + 2);
    later = slots.length - near.length;
    items.push(...near);
  }
  return {year: y, items, nI, nC, tI: Gy ? Gy.tI : 0, tC: Gy ? Gy.tC : 0, count: bricks.length, later};
}
function packRows(items, K) {
  // שורות מתחלפות K ו־K־1, כמו בקיר אמיתי. לבנים קודם, אחריהן המקומות הפנויים.
  const wOf = it => (it.co || it.c?.type === 'company') ? 2 : 1;
  const capOf = i => i % 2 === 0 ? K : K - 1;
  const rows = [];
  const place = list => {
    const pool = list.slice();
    while (pool.length) {
      let r = rows.at(-1);
      if (!r || r.full) { r = {items: [], used: 0, full: false}; rows.push(r); }
      const cap = capOf(rows.length - 1);
      const i = pool.findIndex(it => r.used + wOf(it) <= cap);
      if (i === -1) { r.full = true; continue; }
      const it = pool.splice(i, 1)[0]; r.items.push(it); r.used += wOf(it);
      if (r.used >= cap) r.full = true;
    }
  };
  place(items.filter(x => !x.slot)); place(items.filter(x => x.slot));
  return rows.map(r => r.items);
}

      // ‼ ב-PIVO אסור ליפול בשקט לשמירה בדפדפן: מה שייכתב כאן ייעלם מהטלפון ומהמחשב השני
      if (HOST === 'pivo') { Store.mode = 'failed'; Store.status = 'failed'; UI.readOnly = true; }
      else { Store.mode = 'local'; Store.status = 'local'; Store.outside = true; localRead(); }
    }
  } else { Store.mode = 'local'; Store.status = 'local'; Store.outside = HOST === 'claude'; localRead(); }
  UI.ready = true; UI.anim = {ring: true, wall: true, hero: false};
  renderAll();
}
boot();
})();
</script>
</body>
</html>
