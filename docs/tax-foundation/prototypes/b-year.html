<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שנת המס של הלקוח</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/* חלופה ב׳ · מרכז הכובד הוא שנת המס של הלקוח. הידע נפתח בהקשר, ויש לו גם בית. */
.layout-year { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 980px) { .layout-year { grid-template-columns: minmax(0, 1fr); } }
.proc-switch { display: flex; gap: 6px; flex-wrap: wrap; }
.side-sticky .two-col { grid-template-columns: minmax(0, 1fr); }
.proc-switch button { flex: none; border: 1px solid var(--bd); background: var(--card); border-radius: 999px; padding: 7px 14px; font: inherit; cursor: pointer; color: var(--txc); min-height: 38px; }
.proc-switch button[aria-pressed="true"] { background: var(--soft); border-color: var(--soft-bd); color: var(--br); font-weight: 600; }
.next { border: 1px solid var(--soft-bd); background: var(--soft); border-radius: var(--r-lg); padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.next .grow p { color: var(--txc); }
.counts { display: flex; gap: 18px; flex-wrap: wrap; font-size: var(--fs-13); color: var(--txc); }
.counts b { font-size: var(--fs-17); color: var(--tx); font-variant-numeric: tabular-nums; margin-inline-end: 4px; }
/* ציר השנה: שכבות × תקופות */
.tl { display: grid; grid-template-columns: 120px repeat(6, minmax(64px, 1fr)); gap: 4px; min-width: 600px; }
.tl .lh { font-size: var(--fs-12); color: var(--tx2); padding: 6px 4px; align-self: center; }
.tl .ph { font-size: var(--fs-12); color: var(--tx2); text-align: center; font-variant-numeric: tabular-nums; padding-bottom: 2px; }
.cell { border: 1px solid var(--bd); background: var(--card); border-radius: 7px; padding: 6px 4px; text-align: center; font: inherit; font-size: var(--fs-12); cursor: pointer; min-height: 44px; color: var(--txc); display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.cell .v { font-weight: 600; color: var(--tx); font-variant-numeric: tabular-nums; }
.cell.ok { background: var(--ok-bg); border-color: transparent; }
.cell.nd { background: var(--s2); border-style: dashed; color: var(--tx3); }
.cell.mm { background: var(--warn-bg); border-color: var(--warn); }
.cell.fail { background: var(--err-bg); border-color: transparent; color: var(--err); }
.cell.open { background: transparent; border-style: dashed; color: var(--tx3); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: var(--fs-12); color: var(--tx2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-inline-end: 4px; border: 1px solid var(--bd); }
.who { font-size: var(--fs-12); font-weight: 600; color: var(--tx2); padding-top: 10px; }
.miss { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; align-items: start; }
.miss .why { grid-column: 2 / -1; color: var(--tx2); font-size: var(--fs-13); }
.kind { font-size: var(--fs-12); border-radius: 6px; padding: 1px 6px; background: var(--s2); color: var(--txc); white-space: nowrap; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; }
.req .st { color: var(--txc); font-size: var(--fs-13); }
.ball { font-size: var(--fs-12); font-weight: 600; }
.ball.office { color: var(--br); }
.ball.client { color: var(--tx2); }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.topic-card { text-align: start; border: 1px solid var(--bd); background: var(--card); border-radius: var(--r-lg); padding: 14px; font: inherit; cursor: pointer; color: var(--tx); display: flex; flex-direction: column; gap: 6px; transition: transform 140ms var(--ease-out); }
.topic-card:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { .topic-card:hover { border-color: var(--soft-bd); } }
.path { counter-reset: s; display: flex; flex-direction: column; gap: 0; }
.path > section { border-top: 1px solid var(--hair); padding: 16px 0; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; }
.path > section::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--br); font-weight: 700; display: grid; place-items: center; font-size: var(--fs-13); grid-row: span 3; }
.path > section > * { grid-column: 2; }
.prose { max-width: 66ch; color: var(--txc); display: flex; flex-direction: column; gap: 8px; }
.prose strong { color: var(--tx); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc a { font-size: var(--fs-13); text-decoration: none; padding: 4px 10px; border-radius: 999px; background: var(--s2); color: var(--txc); }
.bar { display: flex; height: 30px; border-radius: 7px; overflow: hidden; border: 1px solid var(--bd); }
.bar > span { display: grid; place-items: center; font-size: var(--fs-12); white-space: nowrap; overflow: hidden; padding-inline: 4px; transition: flex-basis 200ms var(--ease-out); }
.bar .a { background: var(--s2); color: var(--txc); }
.bar .b { background: var(--soft); color: var(--br); font-weight: 600; }
.bar .c { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.cmp { border: 1px solid var(--bd); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.cmp .big { font-size: var(--fs-20); font-weight: 700; font-variant-numeric: tabular-nums; }
.quiz button.opt { display: block; width: 100%; text-align: start; margin-top: 6px; }
.quiz .fb { margin-top: 8px; }
.shot { border: 1px solid var(--bd-strong); border-radius: 8px; overflow: hidden; background: var(--card); font-size: var(--fs-12); }
.shot-h { background: var(--s2); padding: 6px 10px; display: flex; justify-content: space-between; gap: 8px; color: var(--tx2); flex-wrap: wrap; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: var(--fs-12); }
.steps span { padding: 3px 10px; border-radius: 999px; background: var(--s2); color: var(--tx2); }
.steps span.on { background: var(--br); color: var(--on-br); }
.steps span.done { background: var(--ok-bg); color: var(--ok); }
.snap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; font-size: var(--fs-13); }
.phone { width: min(360px, 100%); margin-inline: auto; border: 1px solid var(--bd-strong); border-radius: 26px; padding: 14px; background: var(--page); }
.side-sticky { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 980px) { .side-sticky { position: static; } }
</style>
</head>
<body>
<div id="bar"></div>
<header class="topbar">
  <div class="topbar-in">
    <span class="brand">PIVO</span>
    <nav class="nav" aria-label="ניווט ראשי">
      <button type="button" data-go="office">עונת המס</button>
      <button type="button" data-go="client">לקוחות</button>
      <button type="button" data-go="library">ידע מס</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  const P = window.PIVO, C = P.CASE, nis = P.nis, fmt = P.fmt;
  document.getElementById('bar').innerHTML = P.protoBar('חלופה ב׳ · שנת המס של הלקוח (מומלצת)');
  P.bindTheme();
  const app = document.getElementById('app');
  const S = { view: 'office', proc: 'estimate', tab: 'year', topic: null, read134: 'ok', imported: false, resolved: {}, asked: false, snapshots: [], askSent: false };

  function go(view, extra) { Object.assign(S, { view }, extra || {}); render(); app.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go, b.dataset.go === 'client' ? { tab: 'requests' } : {})));

  /* ── עונת המס: כל התהליכים הפתוחים במשרד, לפי מי צריך לפעול ── */
  function vOffice() {
    const mine = P.OFFICE.filter(o => o.ball === 'office'), wait = P.OFFICE.filter(o => o.ball === 'client');
    const row = o => `<div class="req"><div class="grow"><div class="row"><strong>${o.name}</strong><span class="muted small">· ${o.proc}</span></div><div class="st">${o.tone ? `<span class="chip ${o.tone}">${o.state}</span>` : o.state}</div><div class="xs muted">${o.next}</div></div>${o.go ? `<button class="btn sm primary" data-open-year>להמשיך</button>` : `<button class="btn sm" data-demo-client="${o.name}">לתיק</button>`}</div>`;
    return `<div class="stack">
      <div class="spread"><div><div class="eyebrow">משרד · עונת מס</div><h1>מה פתוח בשנות המס</h1></div><span class="muted small">הערכות 2026 · דוחות 2025 · הצהרות הון</span></div>
      <p class="muted" style="max-width:70ch">רשימה אחת של עבודה מקצועית על שנות מס. כל שורה היא בקשה של הלקוח ב«בקשות», והכפתור מחזיר בדיוק לנקודה שבה העבודה נעצרה.</p>
      <section class="panel pad"><h2 class="small eyebrow" style="font-size:var(--fs-13)">לטיפולי · ${mine.length}</h2><div class="list">${mine.map(row).join('')}</div></section>
      <section class="panel pad"><h2 class="eyebrow" style="font-size:var(--fs-13)">ממתינים ללקוח · ${wait.length}</h2><div class="list">${wait.map(row).join('')}</div></section>
      <details class="more"><summary>איך מגיעים לכאן מכל מקום</summary><div class="prose small" style="padding-bottom:12px"><p>«עונת המס» היא תצוגת משרד של בקשות קיימות מסוג הערכה/דוח/הצהרת הון — לא רשימה נפרדת. אותה עבודה מופיעה ב«בקשות» של כל לקוח, ובמשימות רק כשהמשרד יצר משימה.</p></div></details>
    </div>`;
  }

  /* ── תיק הלקוח: בקשות ושנת המס ── */
  function clientHead() {
    const tabs = [['requests', 'בקשות'], ['taxfile', 'תיק מס'], ['year', 'שנת מס'], ['docs', 'מסמכים']];
    return `<div class="stack" style="gap:8px"><div class="crumbs"><button data-go2="office">עונת המס</button><span>›</span><span>${C.name}</span></div>
      <div class="spread"><div class="row"><h1>${C.name}</h1><span class="chip">לקוחה פעילה</span></div><span class="muted small">${C.people.map(p => p.name + ' · ' + p.desc).join(' &nbsp;|&nbsp; ')}</span></div>
      <div class="proc-switch" role="tablist" aria-label="אזורי התיק">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.tab === k}" aria-pressed="${S.tab === k}" data-tab="${k}">${l}</button>`).join('')}</div></div>`;
  }
  function vRequests() {
    const reqs = C.requests.map(r => {
      const sent = r.id === 'r-ask' && !S.askSent ? '<span class="chip warn">מוכן לשליחה</span>' : '';
      const label = { year: 'לשנת המס ←', portal: 'מה נועה רואה ←', annual: 'לדוח 2025 ←', wealth: 'להצהרת ההון ←' }[r.door];
      return `<div class="req"><div class="grow"><div class="row"><strong>${r.title}</strong><span class="muted small">· ${r.subject}</span>${sent}</div><div class="st">${r.state}</div><div class="ball ${r.ball}">${r.ball === 'office' ? 'אצל המשרד' : 'ממתין ללקוחה'} · מאז ${r.since}</div></div><button class="btn sm ${r.ball === 'office' ? 'primary' : ''}" data-door="${r.door}">${label}</button></div>`;
    }).join('');
    return `${clientHead()}<section class="panel pad stack" style="margin-top:14px"><div class="spread"><h2>בקשות</h2><button class="btn sm" data-send ${S.askSent ? 'disabled' : ''}>${S.askSent ? 'נשלח (הדגמה)' : 'שלח בקשות'}</button></div>
      <p class="muted small">כל עבודה על שנת מס היא שורה כאן. הפירוט חי בשנת המס; השורה לא נעלמת כשנכנסים לפירוט.</p><div class="list">${reqs}</div></section>`;
  }
  function vTaxfile() {
    return `${clientHead()}<section class="panel pad stack" style="margin-top:14px"><h2>תיק מס · עובדות מתמשכות</h2>
      <p class="muted small">מה שנכון לאורך שנים (מצב משפחתי, תיקים, ייצוג). סכומים שנתיים לא נשמרים כאן — הם שייכים לשנת מס.</p>
      <div class="list">${C.known.filter(k => ['card', 'office', 'authority'].includes(k.basis)).map(f => `<div class="fact"><span class="k">${f.k}</span><span class="v">${f.v}</span><span class="src">${f.src}</span></div>`).join('')}</div>
      <div class="note info">שינוי מבנה מוצע: «הפקדות שנתיות», «תרומות שנתיות» ו«הכנסה משכירות» עוברים מהכרטיס לשנת המס, עם המקור והשנה. הערכים הקיימים נשמרים ומסומנים «שנה לא ידועה — לאשר».</div></section>`;
  }

  /* ── שנת המס: שולחן העבודה ── */
  function vYear() {
    const procs = [['estimate', 'הערכת מס 2026'], ['annual', 'דוח שנתי 2025'], ['wealth', 'הצהרת הון ליום 31.12.2025']];
    const sw = `<div class="proc-switch" aria-label="תהליך בשנת המס">${procs.map(([k, l]) => `<button aria-pressed="${S.proc === k}" data-proc="${k}">${l}</button>`).join('')}</div>`;
    const body = S.proc === 'estimate' ? yEstimate() : S.proc === 'annual' ? yAnnual() : yWealth();
    return `${clientHead()}<div class="stack" style="margin-top:14px">${sw}${body}</div>`;
  }

  function cellFor(layer, p) {
    if (layer === 'books') return p.books === 'closed' ? `<span>סגור</span><span class="v">${fmt(p.pnl)}</span>` : '<span>לא נסגר</span>';
    const o = layer === 'it' ? p.it : p.vat;
    if (layer === 'it' && S.read134 === 'fail') return '<span>קריאה נכשלה</span>';
    if (layer === 'it' && S.read134 === 'loading') return '<span class="skel" style="width:70%;margin:auto"></span>';
    if (o.st === 'notDue') return '<span>טרם הגיע המועד</span>';
    return `<span>דווח</span><span class="v">${fmt(o.turnover)}</span>`;
  }
  function cellClass(layer, p) {
    if (layer === 'books') return p.books === 'closed' ? 'ok' : 'open';
    if (layer === 'it' && S.read134 === 'fail') return 'fail';
    const o = layer === 'it' ? p.it : p.vat;
    if (o.st === 'notDue') return 'nd';
    if (p.p === '05–06' && !S.resolved['c-0506'] && (layer === 'it' || layer === 'vat')) return 'mm';
    return 'ok';
  }
  function timeline() {
    const layers = [['books', 'הנהלת חשבונות'], ['it', 'מקדמות · 134'], ['vat', 'מע״מ · ESNA']];
    let g = `<div class="lh"></div>${C.periods.map(p => `<div class="ph">${p.p}</div>`).join('')}`;
    layers.forEach(([k, l]) => { g += `<div class="lh">${l}</div>${C.periods.map((p, i) => `<button class="cell ${cellClass(k, p)}" data-cell="${k}:${i}" aria-label="${l} ${p.p}">${cellFor(k, p)}</button>`).join('')}`; });
    return `<section class="panel pad stack"><div class="spread"><div><h2>השנה לפי תקופות</h2><p class="muted small">ההנהלת חשבונות סגורה עד ${C.bookkeepingCutoff}. מה שאחריה הוא תחזית, לא אפס.</p></div>
      <div class="row"><button class="btn sm" data-import>ייבא רו״ה מפייפרלס</button><button class="btn sm" data-read134 ${S.read134 === 'loading' ? 'disabled' : ''}>קרא שוב 134</button></div></div>
      ${S.read134 === 'fail' ? `<div class="note err" role="alert"><strong>הקריאה מ-134 לא הושלמה.</strong> החיבור לשע״ם לא היה מוכן. הנתונים שנקראו ב-08.10.2026 נשארו כפי שהם — כשל קריאה אינו «אין מקדמות». <button class="btn sm" data-read134>לנסות שוב</button></div>` : ''}
      <div style="overflow-x:auto"><div class="tl" role="group" aria-label="ציר השנה">${g}</div></div>
      <div class="legend"><span><i style="background:var(--ok-bg)"></i>יש ראיה</span><span><i style="background:var(--warn-bg);border-color:var(--warn)"></i>מקורות לא מסכימים</span><span><i style="background:var(--s2);border-style:dashed"></i>טרם הגיע המועד</span><span><i style="border-style:dashed"></i>תקופה פתוחה</span><span><i style="background:var(--err-bg)"></i>קריאה נכשלה</span></div></section>`;
  }
  function missingList() {
    const items = C.missing.map(m => `<div class="miss"><span class="kind">${m.kind === 'document' ? 'מסמך' : m.kind === 'office' ? 'הנחת משרד' : 'שאלה'}</span><strong>${m.k}</strong><span class="xs ${m.ask === 'client' ? '' : 'ball office'}">${m.ask === 'client' ? 'אצל נועה' : 'אצל המשרד'}</span><span class="why">${m.why}</span></div>`).join('');
    return `<section class="panel pad stack"><div class="spread"><h2>מה חסר</h2><button class="btn sm primary" data-ask ${S.asked ? 'disabled' : ''}>${S.asked ? 'נוסף לבקשה ✓' : 'הכן שאלות לנועה (3)'}</button></div>
      <p class="muted small">שואלים רק מה שלא ידוע. כל שאלה נושאת את הסיבה שלה, ומה שהוא שיקול מקצועי נשאר אצל המשרד.</p><div class="list">${items}</div></section>`;
  }
  function knownList() {
    const groups = ['נועה', 'העסק', 'משק הבית'];
    return `<section class="panel pad stack"><h2>מה ידוע</h2>${groups.map(g => `<div class="who">${g}</div><div class="list">${C.known.filter(k => k.who === g).map(f => `<div class="fact"><span class="k">${f.k}</span><span class="v">${f.v}</span><span class="src">${f.src}</span></div>`).join('')}</div>`).join('')}</section>`;
  }
  function conflictBox() {
    const c = C.conflicts[0];
    if (S.resolved[c.id]) return `<div class="note ok">${c.k}: הוכרע — ${S.resolved[c.id]}. ההחלטה נשמרה עם התאריך והמקורות.</div>`;
    return `<section class="panel pad stack" style="border-color:var(--warn)"><div class="spread"><h2>סתירה ליישוב</h2><span class="chip warn">${c.k}</span></div><p class="small">${c.note}.</p>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>מקור</th><th class="n">מחזור</th><th>מתי נקרא</th></tr></thead><tbody>
      <tr><td>${c.a.label}</td><td class="n">${fmt(c.a.v)}</td><td>08.10.2026</td></tr><tr><td>${c.b.label}</td><td class="n">${fmt(c.b.v)}</td><td>09.10.2026 · ייבוא ידני</td></tr><tr><td>${c.c.label}</td><td class="n">${fmt(c.c.v)}</td><td>08.10.2026</td></tr></tbody></table></div>
      <div class="row"><button class="btn sm primary" data-resolve="books">ההנהלת חשבונות נכונה · דיווח המקדמה דורש תיקון</button><button class="btn sm" data-resolve="134">134 נכון · לבדוק את הספרים</button><button class="btn sm ghost" data-resolve="later">להשאיר פתוח עם הערה</button></div>
      <p class="xs muted">ההכרעה לא משנה דבר ברשות. תיקון דיווח, אם יידרש, הוא פעולה נפרדת.</p></section>`;
  }
  function savingsCard() {
    const sf = P.studyFundDeduction({ businessIncome: 193950, employerSalary: 72000, deposit: 0 });
    const thr = P.rule('pen.beneficial.threshold', 2026).value;
    const penDeposits = 72000 * 0.125 + 8000;
    return `<section class="panel pad stack"><div class="spread"><h2>פנסיה וקרן השתלמות · 2026</h2><span class="illus-tag">להמחשה</span></div>
      <div class="two-col">
        <div class="cmp"><div class="eyebrow">קרן השתלמות כעצמאית</div><div class="big">עד ${nis(sf.max)}</div><div class="small muted">ניכוי אפשרי. התקרה ${nis(sf.ceiling)} פחות המשכורת הקובעת ${nis(72000)} שעליה המעביד כבר מפקיד.</div><button class="btn ghost sm" data-topic="studyFund" style="align-self:flex-start">למה? ←</button></div>

      <div class="panel pad"><div class="path">
      <section id="s1"><h3>המשמעות</h3><div class="prose"><p>לעצמאי יש <strong>שתי הטבות נפרדות</strong> על אותה הפקדה: <strong>ניכוי</strong> מההכנסה החייבת בשנת ההפקדה, ו<strong>פטור ממס רווחי הון</strong> על הרווחים כשמושכים כדין.</p><p>הניכוי תלוי בהכנסה. תקרת ההפקדה המוטבת היא סכום שנתי קבוע. לכן שני המספרים אינם שווים, ושקל שמעל תקרת הניכוי עשוי עדיין ליהנות מהפטור.</p></div></section>

        const paint = () => {
          body.innerHTML = ui(); next.disabled = step === 1 && !kind; next.textContent = step === 4 ? 'ייבא לשנת המס' : 'המשך'; back.hidden = step === 1;
          const s = body.querySelector('[data-sample]'); if (s) s.onclick = () => { kind = 'sample'; body.querySelector('#upMsg').innerHTML = '<div class="note ok small">נטען קובץ לדוגמה (נתוני דמה).</div>'; next.disabled = false; };
          const up = body.querySelector('#up'); if (up) up.onchange = () => { kind = 'file'; body.querySelector('#upMsg').innerHTML = `<div class="note small">באב־הטיפוס הקובץ לא נקרא. בגרסת הייצור: חילוץ טבלה + בדיקת זהות. ממשיכים עם נתוני דמה.</div>`; next.disabled = false; };
          const cut = body.querySelector('#cut');
          if (cut) { const rows = () => { body.querySelector('#mrows').innerHTML = months.map(m => `<tr><td>${m.m}/2026</td><td class="n">${m.inc == null ? '<span class="blank">ריק</span>' : fmt(m.inc)}</td><td class="n">${m.exp == null ? '<span class="blank">ריק</span>' : fmt(m.exp)}</td><td>${+m.m <= +cut.value ? (m.inc == null ? '<span class="chip err">סגור אך ריק — לבדוק</span>' : '<span class="chip ok">בפועל</span>') : '<span class="chip">פתוח</span>'}</td></tr>`).join(''); }; cut.onchange = rows; rows(); }
        };
        next.onclick = () => { if (step < 4) { step++; paint(); } else { S.imported = true; close(); P.toast('יובא · 8 חודשים בפועל, 4 פתוחים'); render(); } };
        back.onclick = () => { step = Math.max(1, step - 1); paint(); };
        paint();
      } });
    return dr;
  }

  render();
})();
</script>
</body>
</html>
