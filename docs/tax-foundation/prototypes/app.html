<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הדמיית PIVO · עבודת מס</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">

<style>
/* הדמיית PIVO אחרי השינויים (הכיוון המשולב שגיא בחר 10.10.2026):
   ב׳ = עבודת המשרד מתחילה מהלקוח והתהליך · ג׳ = הדרכה בשאלוני הלקוח ובלמידה · א׳ = מפת 1301 לבקרה ולהעמקה.
   עמודת תוכן אחת עד 860px בעבודה; עמוד הידע מקבל תוכן עניינים צדדי במחשב. */
.col { max-width: 860px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.nav button[aria-disabled="true"], .nav span.off { color: var(--tx3); cursor: default; padding: 14px 10px; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; font-size: var(--fs-14); }
.off-tag { font-size: 10px; border: 1px solid var(--bd); border-radius: 4px; padding: 0 4px; color: var(--tx3); font-weight: 500; }
.acct { position: relative; }
.acct-btn { border: 1px solid var(--bd); background: var(--s2); border-radius: 999px; width: 36px; height: 36px; font: inherit; font-weight: 700; color: var(--tx); cursor: pointer; }
.acct-menu { position: absolute; inset-inline-end: 0; top: 44px; background: var(--card); border: 1px solid var(--bd); border-radius: 10px; box-shadow: var(--shadow); min-width: 200px; padding: 6px; z-index: 30; display: flex; flex-direction: column; transform-origin: top left; transition: opacity 150ms ease, transform 150ms var(--ease-out); }
.acct-menu[hidden] { display: none; }
.acct-menu button, .acct-menu span { text-align: start; border: 0; background: none; font: inherit; padding: 10px 10px; border-radius: 6px; color: var(--tx); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.acct-menu span { color: var(--tx3); cursor: default; }
@media (hover: hover) and (pointer: fine) { .acct-menu button:hover { background: var(--s2); } }
/* מדריך ההדמיה — לא חלק מהמוצר */
.guide { position: fixed; inset-inline-start: 16px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 40; }
.guide-btn { background: transparent; color: var(--proto); border: 1px solid var(--proto); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: var(--fs-13); font-weight: 650; cursor: pointer; min-height: 32px; }
.guide-panel { position: fixed; top: calc(48px + env(safe-area-inset-top, 0px)); inset-inline-start: 16px; width: min(340px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--bd-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
.guide-panel[hidden] { display: none; }
.guide-panel ol { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-13); }
.guide-panel button.lnk { border: 0; background: none; color: var(--br); font: inherit; cursor: pointer; padding: 2px 0; text-align: start; text-decoration: underline; }
/* תיק לקוח */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--bd); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; font: inherit; color: var(--tx2); padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--tx); font-weight: 600; border-bottom-color: var(--br); }
.tabs .off { color: var(--tx3); padding: 10px 12px; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.next-card { border: 1px solid var(--soft-bd); background: var(--soft); border-radius: var(--r-lg); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; }
.next-card .why { color: var(--txc); font-size: var(--fs-13); grid-column: 1; }
.next-card.done { background: var(--ok-bg); border-color: transparent; }
@media (max-width: 560px) { .next-card { grid-template-columns: minmax(0, 1fr); } .next-card .btn { justify-self: start; } }
.proc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 14px 0; align-items: center; }
.proc .t { font-weight: 600; font-size: var(--fs-15); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.proc .s { color: var(--txc); font-size: var(--fs-13); }
.who { font-size: var(--fs-12); font-weight: 600; }
.who.office { color: var(--br); } .who.client { color: var(--tx2); } .who.ok { color: var(--ok); }
.child { margin-inline-start: 18px; padding: 8px 12px; border-inline-start: 2px solid var(--hair); font-size: var(--fs-13); color: var(--txc); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.asof { font-size: var(--fs-12); border-radius: 6px; padding: 1px 7px; background: var(--info-bg); color: var(--info); font-weight: 600; }
.stages { display: flex; gap: 4px; flex-wrap: wrap; }
.stage { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-13); padding: 5px 10px; border-radius: 999px; background: var(--s2); color: var(--tx2); border: 0; font-family: inherit; cursor: pointer; min-height: 34px; }
.stage.done { background: var(--ok-bg); color: var(--ok); }
.stage.now { background: var(--br); color: var(--on-br); font-weight: 600; }
.stage.part { background: var(--warn-bg); color: var(--warn); }
.now-card { border: 1px solid var(--bd-strong); border-radius: var(--r-lg); background: var(--card); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.now-card:focus { outline: none; } .now-card:focus-visible { outline: 2px solid var(--br); outline-offset: 2px; }
.now-card .lbl { font-size: var(--fs-12); font-weight: 700; letter-spacing: .04em; color: var(--br); }
.cmp3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cmp3 > div { border: 1px solid var(--bd); border-radius: 8px; padding: 8px 10px; }
.cmp3 .v { font-weight: 700; font-size: var(--fs-17); font-variant-numeric: tabular-nums; }
.cmp3 .odd { border-color: var(--warn); background: var(--warn-bg); }
@media (max-width: 480px) { .cmp3 { grid-template-columns: minmax(0, 1fr); } }
.queue > div { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; padding: 11px 0; border-top: 1px solid var(--hair); align-items: center; }
.queue .n { width: 22px; height: 22px; border-radius: 50%; background: var(--s2); color: var(--tx2); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.queue .sub { grid-column: 2 / -1; font-size: var(--fs-13); color: var(--tx2); }
.opp { color: var(--ok); font-size: var(--fs-12); font-weight: 650; }
.sec { border: 1px solid var(--bd); border-radius: var(--r-lg); background: var(--card); }
.sec > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; min-height: 56px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary .h { font-weight: 600; }
.sec > summary .sum { grid-column: 1; font-size: var(--fs-13); color: var(--tx2); }
.sec > summary .chev { grid-row: 1 / span 2; grid-column: 2; transition: transform 180ms var(--ease-out); color: var(--tx3); font-size: 18px; }
.sec[open] > summary .chev { transform: rotate(-90deg); }
.sec .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.per { display: grid; grid-template-columns: 70px repeat(6, minmax(54px, 1fr)); gap: 3px; min-width: 450px; font-size: var(--fs-12); }
.per .h { color: var(--tx2); text-align: center; }
.per .l { color: var(--tx2); align-self: center; }
.per .c { border-radius: 6px; padding: 6px 2px; text-align: center; font-variant-numeric: tabular-nums; background: var(--ok-bg); color: var(--ok); }
.per .c.nd { background: var(--s2); color: var(--tx3); }
.per .c.mm { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.per .c.op { background: transparent; border: 1px dashed var(--bd-strong); color: var(--tx3); }
.days { font-variant-numeric: tabular-nums; font-weight: 700; }
.notdemo { font-size: var(--fs-12); color: var(--tx3); border: 1px dashed var(--bd-strong); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.year-card { border: 1px solid var(--bd); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tl { display: flex; flex-direction: column; }
.tl > div { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); font-size: var(--fs-13); }
.tl .d { color: var(--tx2); font-variant-numeric: tabular-nums; }
.clist > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 12px 0; align-items: center; }
/* הדף האישי של הלקוח */
.phone { width: min(380px, 100%); margin-inline: auto; border: 1px solid var(--bd-strong); border-radius: 28px; padding: 16px; background: var(--page); display: flex; flex-direction: column; gap: 12px; }
.pitem { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.qprog { display: flex; gap: 4px; }
.qprog span { flex: 1; height: 4px; border-radius: 2px; background: var(--s2); }
.qprog span.on { background: var(--br); }
/* המשרד */
.office { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; max-width: 1080px; margin-inline: auto; }
@media (max-width: 820px) { .office { grid-template-columns: minmax(0, 1fr); } }
.orail { display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 820px) { .orail { flex-direction: row; overflow-x: auto; scrollbar-width: none; } }
.orail button, .orail span { text-align: start; border: 0; background: none; font: inherit; padding: 10px; border-radius: 8px; color: var(--tx); cursor: pointer; white-space: nowrap; min-height: 42px; display: inline-flex; gap: 6px; align-items: center; }
.orail button[aria-current="page"] { background: var(--soft); color: var(--br); font-weight: 600; }
.orail span { color: var(--tx3); cursor: default; }
.orail .gh { font-size: var(--fs-12); color: var(--tx2); font-weight: 650; padding: 12px 10px 4px; cursor: default; }
@media (max-width: 820px) { .orail .gh { display: none; } }
pre.prompt { white-space: pre-wrap; background: var(--s4); border: 1px solid var(--bd); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 12px; max-height: 260px; overflow: auto; margin: 0; }
/* ידע מס */
.kn-areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.kcard { text-align: start; border: 1px solid var(--bd); background: var(--card); border-radius: var(--r-lg); padding: 14px; font: inherit; color: var(--tx); display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: transform 140ms var(--ease-out), border-color 140ms ease; }
.kcard:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { .kcard:hover { border-color: var(--soft-bd); } }
.kcard .lvl { font-size: var(--fs-12); font-weight: 650; }
.lvl.full { color: var(--ok); } .lvl.outline { color: var(--tx2); }
.learn { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; align-items: start; max-width: 1080px; margin-inline: auto; }
@media (max-width: 900px) { .learn { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
.toc { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-13); }
.toc a { color: var(--tx2); text-decoration: none; padding: 6px 10px; border-radius: 6px; border-inline-start: 2px solid transparent; }
.toc a.on { color: var(--br); border-inline-start-color: var(--br); background: var(--soft); font-weight: 600; }
@media (max-width: 900px) { .toc { top: 52px; flex-direction: row; overflow-x: auto; background: var(--page); padding: 6px 0; z-index: 5; scrollbar-width: none; } .toc a { white-space: nowrap; border: 1px solid var(--bd); border-radius: 999px; } .toc a.on { border-color: var(--soft-bd); } }
.lsec { scroll-margin-top: 110px; display: flex; flex-direction: column; gap: 10px; padding-block: 18px; border-top: 1px solid var(--hair); }
.lsec h2 { font-size: var(--fs-20); }
.prose { max-width: 66ch; color: var(--txc); display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-15); line-height: 1.7; }
.prose strong { color: var(--tx); }
.oneliner { font-size: 19px; line-height: 1.55; color: var(--tx); max-width: 60ch; font-weight: 500; }
.outcomes { margin: 0; padding-inline-start: 18px; color: var(--txc); display: flex; flex-direction: column; gap: 4px; }
.ctxbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--soft); border: 1px solid var(--soft-bd); border-radius: 10px; padding: 10px 14px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .two { grid-template-columns: minmax(0, 1fr); } }
.benefit { border: 1px solid var(--bd); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.benefit .when { font-size: var(--fs-12); font-weight: 700; letter-spacing: .03em; }
.benefit.ded .when { color: var(--br); } .benefit.ex .when { color: var(--ok); }
.sim { border: 1px solid var(--bd-strong); border-radius: 14px; padding: 16px; background: var(--card); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 20px; }
@media (max-width: 760px) { .sim { grid-template-columns: minmax(0, 1fr); } }
.sim .inputs { display: flex; flex-direction: column; gap: 12px; }
.bar { position: relative; display: flex; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--bd); background: var(--s4); }
.bar > span { display: grid; place-items: center; font-size: var(--fs-12); white-space: nowrap; overflow: hidden; transition: flex-basis 180ms var(--ease-out); min-width: 0; }
.seg-emp { background: var(--s2); color: var(--tx2); }
.seg-biz { background: var(--soft); color: var(--br); font-weight: 650; }
.seg-ded { background: var(--br); color: var(--on-br); font-weight: 650; }
.seg-ex { background: var(--ok-bg); color: var(--ok); font-weight: 650; }
.seg-none { background: var(--err-bg); color: var(--err); font-weight: 650; }
.marks { position: relative; height: 18px; font-size: 11px; color: var(--tx2); }
.marks span { position: absolute; transform: translateX(50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.marks span::before { content: ''; position: absolute; top: -6px; inset-inline-start: 50%; width: 1px; height: 6px; background: var(--tx3); }
.legend2 { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-12); color: var(--tx2); }
.legend2 i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-inline-end: 4px; vertical-align: -1px; }
.explain { background: var(--s4); border-radius: 10px; padding: 12px; font-size: var(--fs-14); color: var(--txc); line-height: 1.6; }
.examples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .examples { grid-template-columns: minmax(0, 1fr); } }
.ex { border: 1px solid var(--bd); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.walk { border: 1px solid var(--bd-strong); border-radius: 14px; padding: 16px; background: var(--card); display: flex; flex-direction: column; gap: 12px; }
.walk .num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.walk-dots { display: flex; gap: 6px; }
.walk-dots span { width: 26px; height: 4px; border-radius: 2px; background: var(--s2); }
.walk-dots span.on { background: var(--br); }
.traps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .traps { grid-template-columns: minmax(0, 1fr); } }
.trap { border: 1px solid var(--bd); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.trap.no { border-color: var(--err); }
.inform { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .inform { grid-template-columns: minmax(0, 1fr); } }
.inform > div { border-top: 3px solid var(--soft-bd); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-13); color: var(--txc); }
.inform b { color: var(--tx); font-size: var(--fs-14); }
.quiz .opt { display: block; width: 100%; text-align: start; margin-top: 6px; }
.quiz .opt[aria-pressed="true"].right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.quiz .opt[aria-pressed="true"].wrong { border-color: var(--err); background: var(--err-bg); color: var(--err); }
.map1301 { display: flex; flex-direction: column; }
.map1301 > div { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--hair); align-items: center; }
@media (max-width: 640px) { .crumbs button { min-height: 40px; padding-inline: 6px; } }
.map1301 .lt { font-weight: 700; color: var(--br); text-align: center; font-size: var(--fs-17); }
</style>
</head>
<body>
<div id="bar"></div>
<header class="topbar"><div class="topbar-in"><span class="brand">PIVO</span>
  <nav class="nav" aria-label="ניווט ראשי">
    <span class="off">משימות <span class="off-tag">לא בהדגמה</span></span>
    <button type="button" data-nav="clients">לקוחות</button>
    <button type="button" data-nav="taxwork">עבודת מס</button>
    <button type="button" data-nav="learn">ידע מס</button>
    <span class="off">הצעות ולידים <span class="off-tag">לא בהדגמה</span></span>
  </nav>
  <div class="acct"><button type="button" class="acct-btn" id="acctBtn" aria-haspopup="menu" aria-expanded="false" aria-label="תפריט המשתמש">גי</button>
    <div class="acct-menu" id="acctMenu" role="menu" hidden><button role="menuitem" data-nav="office">המשרד <span class="xs muted">תבניות, ידע, אוטומציות</span></button><button role="menuitem" data-nav="portal">מה הלקוח רואה <span class="xs muted">הדף האישי</span></button><span>חיבורים <span class="off-tag">לא בהדגמה</span></span></div></div>
</div></header>
<main class="wrap" id="app" tabindex="-1"></main>
<div class="guide"><div class="guide-panel" id="guidePanel" hidden role="dialog" aria-label="מסלולי ההדמיה">
  <strong>מסלולים להדמיה</strong><p class="xs muted">קיצורים בלבד — אפשר גם לנווט חופשי. לא חלק מהמוצר.</p>
  <ol>
    <li><button class="lnk" data-tour="learn">ללמוד: קרן השתלמות לשכיר־עצמאי</button></li>
    <li><button class="lnk" data-tour="client">מלקוחה לבקשות ולתיק המס</button></li>
    <li><button class="lnk" data-tour="estimate">הערכת מס 2026: מה עוצר עכשיו</button></li>
    <li><button class="lnk" data-tour="portal">מה נועה רואה ועונה</button></li>
    <li><button class="lnk" data-tour="taxwork">לחזור לעבודה: «עבודת מס»</button></li>
    <li><button class="lnk" data-tour="annual">דוח שנתי 2025 ומפת 1301</button></li>
    <li><button class="lnk" data-tour="wealth">הצהרת הון ליום קובע</button></li>
    <li><button class="lnk" data-tour="office">המשרד: תבניות, ידע ועדכניות</button></li>
  </ol>
  <button class="btn sm" id="resetDemo">איפוס ההדמיה</button>
</div><button class="guide-btn" id="guideBtn" aria-expanded="false" aria-controls="guidePanel">מסלולי הדמיה</button></div>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  const P = window.PIVO, C = P.CASE, nis = P.nis, fmt = P.fmt;
  document.getElementById('bar').innerHTML = P.protoBar('הדמיית PIVO אחרי השינויים · הכיוון המשולב');
  document.querySelector('.proto-bar').prepend(document.getElementById('guideBtn'));
  P.bindTheme();
  const app = document.getElementById('app');
  const TODAY = new Date(2026, 9, 10);
  const DEADLINE = new Date(2027, 0, 12);
  const daysLeft = d => Math.round((d - TODAY) / 86400000);

  /* ── מצב ההדמיה. נשמר בלשונית בלבד, כדי שמעבר בין דפים לא יאפס את המסלול ── */
  const FRESH = { route: 'clients', tab: 'requests', ctx: null, resolved: false, asked: false, sent: false, answered: false, accepted: false, forecast: false, approved: false, office: 'templates', learnTab: 'topics', topic: null, open: {}, answers: {}, log: [] };
  let S = { ...FRESH, open: {}, answers: {}, log: [] };
  try { const st = JSON.parse(sessionStorage.getItem('pivo-demo') || 'null'); if (st) S = Object.assign(S, st); } catch (e) { /* בלי אחסון */ }
  const save = () => { try { sessionStorage.setItem('pivo-demo', JSON.stringify(S)); } catch (e) { /* לא קריטי */ } };
  const ROUTES = ['clients', 'client', 'estimate', 'annual', 'wealth', 'taxwork', 'learn', 'topic', 'office', 'portal'];
  const hash = (location.hash || '').slice(1);
  if (ROUTES.includes(hash)) S.route = hash;
  if (hash === 'noa-learn') { S.route = 'topic'; S.topic = 'studyFund'; S.ctx = 'noa'; }
  const logIt = t => { S.log.unshift({ d: '10.10.2026', t }); };

  function go(route, extra) {
    Object.assign(S, { route }, extra || {});
    save(); try { history.replaceState(null, '', '#' + route); } catch (e) { /* מסגרת שלא מאפשרת — הניווט עובד גם בלי */ } render();
    window.scrollTo({ top: 0 }); app.focus({ preventScroll: true });
  }

  /* מכונת המצב של הערכת המס: פריט אחד «עכשיו», והשאר בתור */
  function est() {
    if (!S.resolved) return { stage: 'evidence', now: 'conflict', line: 'ראיות · סתירה אחת עוצרת', next: 'ליישב את מחזור 05–06/2026', why: 'מקדמות 134 מראות 2,500 ₪ יותר מהספרים ומהמע״מ.', ball: 'office' };
    if (!S.asked) return { stage: 'info', now: 'ask', line: 'מידע · 3 פריטים חסרים אצל נועה', next: 'לשאול את נועה 3 דברים', why: 'בלי התשובות אין המלצת הפקדה.', ball: 'office' };
    if (!S.sent) return { stage: 'info', now: 'send', line: 'מידע · השאלות מוכנות ועדיין לא נשלחו', next: 'לשלוח לנועה את השאלות', why: 'הן יתפרסמו בדף האישי שלה ב«שלח בקשות».', ball: 'office' };
    if (!S.answered) return { stage: 'info', now: 'wait', line: 'מידע · ממתין לתשובות נועה', next: 'ממתין לנועה', why: 'השאלות פורסמו בדף האישי ב-10.10.2026.', ball: 'client' };
    if (!S.accepted) return { stage: 'info', now: 'accept', line: 'מידע · נועה ענתה, לאשר', next: 'לאשר את תשובות נועה', why: 'התשובות נכנסות לשנת המס רק אחרי אישור המשרד.', ball: 'office' };
    if (!S.forecast) return { stage: 'forecast', now: 'forecast', line: 'תחזית · ממתין להנחת משרד', next: 'לקבוע תחזית לספטמבר–דצמבר', why: 'הספרים סגורים עד 31.08.2026.', ball: 'office' };
    if (!S.approved) return { stage: 'rec', now: 'approve', line: 'המלצה · טיוטה מוכנה לאישור', next: 'לאשר את ההערכה', why: 'האישור שומר תמונת מצב שלא משתנה.', ball: 'office' };
    return { stage: 'done', now: 'done', line: 'הושלם · תמונת מצב 1 אושרה 10.10.2026', next: 'ההערכה אושרה', why: 'טיוטת הסיכום ללקוחה מוכנה. השליחה עצמה לא הודגמה.', ball: 'ok' };
  }

    return `<div class="col"><div class="spread"><h1>לקוחות</h1><label class="sr-only" for="cs">חיפוש</label><input id="cs" type="search" placeholder="חיפוש לפי שם" style="max-width:260px" disabled title="לא בהדגמה"></div>

          <div class="proc"><div><div class="t">הערכת מס 2026 <span class="chip blue">שנת מס 2026</span></div><div class="s">${e.line}</div><div class="who ${e.ball}">${e.ball === 'office' ? 'אצל המשרד' : e.ball === 'client' ? 'ממתין לנועה' : 'הושלם'}</div></div><button class="btn sm ${e.ball === 'office' ? 'primary' : ''}" data-go="estimate">${e.now === 'done' ? 'לתוצאה' : 'לפתוח'}</button></div>
          ${S.asked ? `<div class="child"><span>↳ השלמת מידע · 3 פריטים לנועה</span>${!S.sent ? '<span class="chip warn">מוכן לשליחה</span>' : !S.answered ? '<span class="chip">פורסם בדף האישי · 10.10</span>' : '<span class="chip ok">נועה ענתה</span>'}</div>` : ''}
          <div class="proc"><div><div class="t">הצהרת הון <span class="asof">ליום 31.12.2025</span></div><div class="s">דרישה מתועדת · להגיש עד 12.01.2027 · <span class="days">נותרו ${daysLeft(DEADLINE)} ימים</span></div><div class="who office">אצל המשרד</div></div><button class="btn sm" data-go="wealth">לפתוח</button></div>
          <div class="proc"><div><div class="t">דוח שנתי 2025 <span class="chip blue">שנת מס 2025</span></div><div class="s">חסרים 2 מסמכים: 106 של עידו, אישור תרומות</div><div class="who client">ממתין לנועה ועידו · מאז 21.09</div></div><button class="btn sm" data-go="annual">לפתוח</button></div>
        </div></section>
      <details class="more"><summary>הושלמו (2)</summary><div class="small muted" style="padding-bottom:10px">ייצוג במס הכנסה · ייצוג בביטוח לאומי</div></details>
      <details class="more"><summary>למה הצהרת ההון היא שורה נפרדת</summary><p class="small muted" style="padding-bottom:10px;max-width:70ch">הצהרת הון היא תמונת מצב ליום קובע, עם מועד משלה, והיא כוללת את עידו והילדים. היא משתמשת בעובדות של שנות המס, אבל אינה חלק מתהליך שנתי.</p></details>`;
  }

        <div class="list">${[['מצב משפחתי', 'נשואה · 2 ילדים (2017, 2021)', 'כרטיס'], ['תיק מס הכנסה', 'עוסקת · מקדמות 7% דו־חודשי', '134 · 08.10.2026'], ['מע״מ', 'עוסק מורשה · דו־חודשי', 'יישור קו · 12.07.2026'], ['בן הזוג הרשום', 'טרם הוכרע', 'החלטת משרד חסרה']].map(([k, v, s]) => `<div class="fact"><span class="k">${k}</span><span class="v">${v}</span><span class="src">${s}</span></div>`).join('')}</div>

  }
  function tDocs() {
    const rows = [['2026 › ראיות', 'רו״ה פייפרלס 01–12/2026 (הופק 09.10)', 'ייבוא ידני · 09.10.2026'], ['2026 › רשויות', 'צילום שאילתה 134 · מקדמות', 'בדיקה אוטומטית · 08.10.2026'], ['2026 › רשויות', 'צילום ESNA · סיכומי דיווח מע״מ', 'בדיקה אוטומטית · 08.10.2026'], ['הצהרת הון 31.12.2025', 'מכתב דרישה מפקיד השומה · 14.09.2026', 'הועלה ע״י המשרד · אושר כדרישה']];

  }

  /* ── הערכת מס: עכשיו · אחר כך · פירוט כשצריך ── */
  function stagesBar(cur) {
    const st = [['info', 'מידע'], ['evidence', 'ראיות'], ['forecast', 'תחזית ותיאומים'], ['rec', 'המלצה ואישור']];
    const done = { info: S.accepted, evidence: S.resolved, forecast: S.forecast, rec: S.approved };
    return `<nav class="stages" aria-label="היכן ההערכה עומדת">${st.map(([k, l]) => { const cls = done[k] ? 'done' : k === cur ? 'now' : (k === 'info' && S.asked) ? 'part' : ''; return `<button class="stage ${cls}" data-jump="${k}" ${k === cur ? 'aria-current="step"' : ''}>${done[k] ? '✓ ' : cls === 'part' ? '◐ ' : ''}${l}</button>`; }).join('')}</nav>
      <p class="xs muted">השלבים מראים איפה ההערכה עומדת. כל שלב נפתח בלחיצה — זה לא מסלול חובה.</p>`;

  function nowCard(e) {

        <div class="cmp3"><div class="odd"><div class="xs muted">${c.a.label} · נקרא 08.10</div><div class="v">${fmt(c.a.v)}</div></div><div><div class="xs muted">${c.b.label} · ייבוא 09.10</div><div class="v">${fmt(c.b.v)}</div></div><div><div class="xs muted">${c.c.label} · נקרא 08.10</div><div class="v">${fmt(c.c.v)}</div></div></div>
        <div class="row"><button class="btn primary" data-resolve="books">הספרים נכונים · לבדוק את דיווח המקדמה</button><button class="btn" data-resolve="134">134 נכון · לבדוק את הספרים</button></div><button class="btn ghost sm" data-sec="evidence" style="align-self:flex-start">לראות את כל התקופות</button>`);

        <p class="xs muted">לא נשאל מה שכבר ידוע: משכורת, ילדים, אחוז משרד ביתי. מי בן הזוג הרשום — החלטה של המשרד, לא שאלה ללקוחה.</p>
        <div class="row"><button class="btn primary" data-ask>הוסף לבקשה «השלמת מידע»</button><button class="btn ghost" data-learn-ctx>למה שואלים על קרן השתלמות?</button></div>`);
      case 'send': return card('לשלוח לנועה את השאלות', `<p class="small">הפריטים נוספו לבקשה «השלמת מידע». השליחה נעשית מ«בקשות», יחד עם כל מה שמוכן לנועה — מייל אחד עם קישור לדף האישי.</p><div class="row"><button class="btn primary" data-send>שלח בקשות</button></div>`);

      case 'accept': return card('לאשר את תשובות נועה', `<div class="list small">${answersRows()}</div><p class="xs muted">כל תשובה נכנסת לשנת המס 2026 עם המקור «דף אישי · נועה · 10.10.2026».</p><div class="row"><button class="btn primary" data-accept>לאשר הכל</button></div>`);
      case 'forecast': return card('תחזית לספטמבר–דצמבר', forecastForm());
      case 'approve': return card('לאשר את ההערכה', `${calcTable()}<div class="note info small"><strong>טיוטת המלצה:</strong> הפקדה לקרן השתלמות כעצמאית עד ${nis(8728)} עד 31.12.2026 (${S.answers.sf === 'no' ? 'אין לה קרן — תיפתח קרן חדשה' : 'לקרן הקיימת'}). שינוי מקדמות — לא מומלץ לפני בדיקת דיווח 05–06.</div><p class="xs muted">האישור שומר תמונת מצב: הנתונים, ההנחות וגרסת הכללים. כלל שישתנה אחר כך לא ישנה אותה — תופיע הערה.</p><div class="row"><button class="btn primary" data-approve>לאשר ולשמור תמונת מצב</button></div>`);
      default: return `<section class="now-card" id="now" tabindex="-1" style="border-color:var(--ok)"><span class="lbl" style="color:var(--ok)">התוצאה</span><h2>תמונת מצב 1 · אושרה 10.10.2026</h2>${calcTable()}
        <div class="list small"><div class="fact"><span class="k">טיוטת סיכום ללקוחה</span><span class="v">מוכנה</span><span class="src">שליחה — <span class="notdemo">לא בהדגמה</span></span></div><div class="fact"><span class="k">איפה מוצאים אחר כך</span><span class="v">בקשות · תיק מס › 2026</span><span class="src">ובפעילות</span></div></div></section>`;
    }
  }
  function answersRows() {
    const a = S.answers;

          <div class="note warn small">האם רכיב הפיצויים נספר ברף — לא הוכרע. ערכי 2026 טרם פורסמו במדריך הרשמי.</div>

      <p class="xs muted">השוואת הון בין הצהרות — במבנה הנתונים; התוכן ייקבע אחרי סקירת החומרים.</p></div>`;

  /* ── הדף האישי של הלקוח ── */
  function vPortal() {
    const a = S.answers; const step = S.pstep || 0;
    let inner;
    if (!S.sent) inner = `<div class="pitem"><strong>אין כרגע בקשות חדשות</strong><p class="small muted">השאלות להערכת המס עוד לא נשלחו מהמשרד. שלחו אותן מ«בקשות» ← «שלח בקשות».</p></div>`;
    else if (S.answered) inner = `<div class="pitem"><strong>השלמת מידע להערכת מס 2026</strong><span class="chip ok" style="align-self:flex-start">נשלח למשרד · 10.10.2026</span><p class="small muted">תודה. המשרד יעדכן אותך אם יידרש עוד משהו.</p></div>`;
    else {
      const qs = [
        { h: 'יש לך ביטוח אובדן כושר עבודה שאת משלמת בעצמך?', why: 'התשלום הזה משנה כמה מההפקדה לפנסיה מזכה אותך בהחזר מס.', body: `<label class="choice"><input type="radio" name="dis" id="dis-y" value="yes" ${a.dis === 'yes' ? 'checked' : ''}> כן</label><label class="f" for="disAmt" ${a.dis === 'yes' ? '' : 'hidden'} id="disWrap">כמה בערך בשנה?<input id="disAmt" type="number" inputmode="numeric" value="${a.disAmt || ''}" placeholder="למשל 2,400"></label><label class="choice"><input type="radio" name="dis" id="dis-n" value="no" ${a.dis === 'no' ? 'checked' : ''}> לא</label><label class="choice"><input type="radio" name="dis" id="dis-u" value="unsure" ${a.dis === 'unsure' ? 'checked' : ''}> לא בטוחה</label>` },
        { h: 'יש לך קרן השתלמות כעצמאית?', why: 'אם יש, חשוב לדעת מתי הפקדת בה לראשונה — זה קובע מתי אפשר למשוך בלי מס.', body: `<label class="choice"><input type="radio" name="sf" id="sf-y" value="yes" ${a.sf === 'yes' ? 'checked' : ''}> כן</label><label class="f" for="sfYear" ${a.sf === 'yes' ? '' : 'hidden'} id="sfWrap">באיזו שנה הפקדת לראשונה?<input id="sfYear" type="number" inputmode="numeric" value="${a.sfYear || ''}" placeholder="למשל 2021"></label><label class="choice"><input type="radio" name="sf" id="sf-n" value="no" ${a.sf === 'no' ? 'checked' : ''}> לא</label>` },
        { h: 'אישור שנתי מקרן הפנסיה', why: 'ההפקדה בפועל קובעת את הטבת המס. האישור יוצא אחרי סוף השנה.', body: `<p class="small">אין צורך עכשיו. נזכיר לך בינואר.</p><p class="xs muted">העלאת קובץ <span class="notdemo">לא בהדגמה</span></p>` },
      ];
      const q = qs[step];
      inner = `<div class="pitem"><div class="spread"><strong>השלמת מידע להערכת מס 2026</strong><span class="xs muted">${step + 1} מתוך 3</span></div><div class="qprog" aria-hidden="true">${qs.map((_, i) => `<span class="${i <= step ? 'on' : ''}"></span>`).join('')}</div>
        <fieldset><legend>${q.h}</legend>${q.body}</fieldset><details class="more"><summary>למה שואלים?</summary><p class="small muted" style="padding-bottom:8px">${q.why}</p></details>
        <div id="pErr" aria-live="polite"></div><div class="spread"><button class="btn" data-pprev ${step === 0 ? 'disabled' : ''}>הקודם</button>${step < 2 ? '<button class="btn primary" data-pnext>הבא</button>' : '<button class="btn primary" data-psubmit>שליחה למשרד</button>'}</div></div>`;

  /* המחשבון: חישוב לפי הנוסחה מהמדריך (ערכי 2025) והצגה בקנה מידה */
  const SIM = { biz: 195000, sal: 72000, dep: 9000 };
  function bindSim() {
    const $ = id => document.getElementById(id); if (!$('s-biz')) return;
    if (S.ctx === 'noa') Object.assign(SIM, { biz: 193950, sal: 72000, dep: 8728 });
    $('s-biz').value = SIM.biz; $('s-sal').value = SIM.sal; $('s-dep').value = SIM.dep;
    const upd = () => {
      SIM.biz = +$('s-biz').value; SIM.sal = +$('s-sal').value; SIM.dep = +$('s-dep').value; const rate = +$('s-rate').value;
      const r = P.studyFundDeduction({ businessIncome: SIM.biz, employerSalary: SIM.sal, deposit: SIM.dep, year: 2025 });
      const ceil = r.ceiling, emp = Math.min(SIM.sal, ceil);
      $('o-biz').textContent = nis(SIM.biz); $('o-sal').textContent = nis(SIM.sal); $('o-dep').textContent = nis(SIM.dep);
      $('bE').style.flexBasis = (emp / ceil * 100) + '%'; $('bE').textContent = emp / ceil > .18 ? 'המעביד' : '';
      $('bB').style.flexBasis = (r.cap / ceil * 100) + '%'; $('bB').textContent = r.cap / ceil > .2 ? 'בסיס הניכוי' : '';
      $('barInc').setAttribute('aria-label', `מתוך תקרה של ${fmt(ceil)}: המעביד ${fmt(emp)}, בסיס הניכוי ${fmt(r.cap)}`);
      const ded = r.ded, exOnly = Math.max(0, Math.min(SIM.dep, r.exempt) - ded), none = Math.max(0, SIM.dep - Math.max(r.exempt, ded));
      const scale = Math.max(SIM.dep, r.exempt) * 1.08 || 1;
      $('dD').style.flexBasis = (ded / scale * 100) + '%'; $('dD').textContent = ded / scale > .14 ? fmt(ded) : '';
      $('dX').style.flexBasis = (exOnly / scale * 100) + '%'; $('dX').textContent = exOnly / scale > .14 ? fmt(exOnly) : '';
      $('dN').style.flexBasis = (none / scale * 100) + '%'; $('dN').textContent = none / scale > .12 ? fmt(none) : '';
      $('barDep').setAttribute('aria-label', `הפקדה ${fmt(SIM.dep)}: מנוכה ${fmt(ded)}, פטור בעתיד בלבד ${fmt(exOnly)}, בלי הטבה ${fmt(none)}`);
      $('marks').innerHTML = `<span style="inset-inline-start:${Math.max(12, Math.min(84, r.max / scale * 100))}%">מרחב ניכוי ${fmt(r.max)}</span><span style="inset-inline-start:${Math.max(12, Math.min(84, r.exempt / scale * 100))}%;top:0">תקרה מוטבת ${fmt(r.exempt)}</span>`;
      const marks = $('marks').children; if (Math.abs(r.max - r.exempt) / scale < .28) marks[1].style.top = '14px';
      $('marks').style.height = Math.abs(r.max - r.exempt) / scale < .28 ? '32px' : '18px';
      const base = SIM.sal ? `המעביד כבר מפקיד על ${nis(SIM.sal)}, אז מהתקרה נשארו ${nis(Math.max(0, ceil - SIM.sal))}. ` : 'אין מעביד שמפקיד לקרן, אז כל התקרה פתוחה. ';
      const capWhy = r.cap === SIM.biz ? `ההכנסה מהעסק (${nis(SIM.biz)}) קטנה יותר, ולכן היא הבסיס.` : `זה פחות מההכנסה מהעסק, ולכן זה הבסיס.`;
      $('simTxt').innerHTML = `${base}${capWhy} <strong>מרחב הניכוי: ${nis(r.max)}</strong> (4.5%). מתוך ההפקדה שלך, <strong>${nis(ded)} מנוכים עכשיו</strong> — חיסכון של כ-${nis(ded * rate)} בשיעור ${Math.round(rate * 100)}%${exOnly ? `; <strong>${nis(exOnly)}</strong> נהנים רק מהפטור בעתיד` : ''}${none ? `; <strong>${nis(none)}</strong> מעל התקרה המוטבת — בלי הטבה` : ''}.`;
    };
    ['s-biz', 's-sal', 's-dep', 's-rate'].forEach(id => $(id).addEventListener('input', upd));
    upd();
    app.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { const v = { ex1: [120000, 0, 9000], ex2: [195000, 72000, 9000], ex3: [250000, 188544, 13203] }[b.dataset.ex]; $('s-biz').value = v[0]; $('s-sal').value = v[1]; $('s-dep').value = v[2]; upd(); document.getElementById('l3').scrollIntoView({ block: 'start' }); $('s-biz').focus({ preventScroll: true }); });
  }
  function bindWalk() {
    const el = document.getElementById('walk'); if (!el) return;
    const noa = S.ctx === 'noa'; const sal = noa ? 72000 : 188544, biz = noa ? 193950 : 200000;
    const rem = 293397 - sal, cap = Math.min(biz, rem), ded = Math.round(cap * 0.045);
    const steps = [
      ['מה המעביד כבר «השתמש»', fmt(sal), `המשכורת שהמעביד הפקיד עליה לקרן. בטופס 106 מול הקוד 218/219, ובדוח בסעיף 52.`],
      ['כמה נשאר מהתקרה', `${fmt(293397)} − ${fmt(sal)} = ${fmt(rem)}`, 'התקרה השנתית של «הכנסה קובעת» פחות המשכורת.'],
      ['משווים להכנסה מהעסק', `הנמוך מבין ${fmt(biz)} ל-${fmt(rem)} = ${fmt(cap)}`, 'זה «סכום התקרה» — הבסיס לניכוי כעצמאי.'],
      ['הניכוי המרבי', `${fmt(cap)} × 4.5% = ${fmt(ded)}`, noa ? 'זה מרחב ההפקדה שמוריד מס לנועה השנה.' : 'כך גם בדוגמה במדריך הרשמי: 4,718 ₪.'],
      ['ומה עם הפקדה גבוהה יותר?', `עד ${fmt(20566)} — פטור בעתיד בלבד`, 'מעל מרחב הניכוי ההפקדה לא מורידה מס היום. עד התקרה המוטבת הרווחים עדיין עשויים להיות פטורים (מקור משני).'],
    ];
    let i = 0;
    const paint = () => { const [h, n, d] = steps[i]; el.innerHTML = `<div class="walk-dots" aria-hidden="true">${steps.map((_, k) => `<span class="${k <= i ? 'on' : ''}"></span>`).join('')}</div><span class="xs muted">צעד ${i + 1} מתוך ${steps.length}</span><strong>${h}</strong><span class="num">${n}</span><span class="small">${d}</span><div class="spread"><button class="btn" data-w="-1" ${i === 0 ? 'disabled' : ''}>הקודם</button>${i < steps.length - 1 ? '<button class="btn primary" data-w="1">הצעד הבא</button>' : '<button class="btn" data-w="all">להציג הכל</button>'}</div>`;
      el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { if (b.dataset.w === 'all') { el.innerHTML = `<ol class="small" style="margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px">${steps.map(([h, n]) => `<li><strong>${h}:</strong> ${n}</li>`).join('')}</ol><button class="btn sm" data-wr style="align-self:flex-start">מההתחלה</button>`; el.querySelector('[data-wr]').onclick = () => { i = 0; paint(); }; return; } i = Math.max(0, Math.min(steps.length - 1, i + +b.dataset.w)); paint(); }); };
    paint();
  }
  function bindQuiz() {
    const el = document.getElementById('quiz'); if (!el) return;
    const Q = [
      { q: 'עצמאית שהמעביד שלה מפקיד לקרן על 120,000 ₪, והכנסתה מהעסק 250,000 ₪. מה בסיס הניכוי שלה?', o: [['250,000 — כל ההכנסה מהעסק', 0], ['173,397 — התקרה פחות המשכורת', 1], ['293,397 — התקרה המלאה', 0]], fb: 'הנמוך מבין ההכנסה מהעסק לבין 293,397 − 120,000. ניכוי מרבי: 7,803 ₪.' },
      { q: 'עצמאי בלבד, הכנסה 100,000 ₪, הפקיד 12,000 ₪. מה קורה ל-7,500 ₪ שמעל 4,500?', o: [['לא מנוכים, אבל עשויים ליהנות מהפטור בעתיד', 1], ['מנוכים בשנה הבאה', 0], ['חייבים במס מיד', 0]], fb: 'הניכוי הוא 4.5% מ-100,000 = 4,500. השאר לא מוריד מס היום, ועד התקרה המוטבת נהנה מהפטור במשיכה.' },
      { q: 'לקוח מציע לפצל הפקדות לשלוש קרנות ולפדות כל אחת בשנה אחרת, «כדי שלא יצליבו». מה עונים?', o: [['זה תכנון לגיטימי שחוסך מס', 0], ['התקרה לפי היחיד והשנה; זה לא מקנה זכות, ו-PIVO לא ממליץ על זה', 1]], fb: 'ההצעה נשענת על היעדר בקרה, לא על זכות.' },
    ];
    el.innerHTML = Q.map((x, qi) => `<div class="quiz panel pad" data-q="${qi}"><strong class="small">${qi + 1}. ${x.q}</strong>${x.o.map(([t, r], oi) => `<button class="btn opt" data-qo="${qi}:${oi}" aria-pressed="false">${t}</button>`).join('')}<div class="fb" aria-live="polite"></div></div>`).join('');
    el.querySelectorAll('[data-qo]').forEach(b => b.onclick = () => {
      const [qi, oi] = b.dataset.qo.split(':').map(Number); const x = Q[qi]; const box = el.querySelector(`[data-q="${qi}"]`);
      box.querySelectorAll('.opt').forEach(o => { o.setAttribute('aria-pressed', 'false'); o.classList.remove('right', 'wrong'); });
      b.setAttribute('aria-pressed', 'true'); const ok = x.o[oi][1] === 1; b.classList.add(ok ? 'right' : 'wrong');
      box.querySelector('.fb').innerHTML = `<div class="note ${ok ? 'ok' : 'warn'} small" style="margin-top:8px">${ok ? 'נכון.' : 'לא בדיוק.'} ${x.fb}</div>`;
    });
  }
  function bindToc() {
    const links = [...document.querySelectorAll('[data-toc]')]; if (!links.length) return;
    links.forEach(a => a.onclick = e => { e.preventDefault(); const t = document.getElementById(a.dataset.toc); t.scrollIntoView({ block: 'start' }); t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); });
    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.toc === en.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
    document.querySelectorAll('.lsec').forEach(s => io.observe(s));
  }

    bindSim(); bindWalk(); bindQuiz(); bindToc();
  }
  function after(msg) { save(); render(); P.toast(msg); const n = document.getElementById('now'); if (n) n.focus({ preventScroll: false }); }
  function openSec(id) { S.open[id] = true; const d = document.getElementById('sec-' + id); if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); d.querySelector('summary').focus({ preventScroll: true }); } }
  function sendTray() {
    P.drawer({ eyebrow: 'שלח בקשות · נועה ברק', title: 'מה יישלח',
      body: `<p class="small">מייל אחד לנועה, עם קישור לדף האישי. בדף יופיעו:</p><div class="panel pad stack" style="gap:4px"><strong>השלמת מידע להערכת מס 2026</strong><span class="small muted">3 פריטים · אובדן כושר עבודה · קרן השתלמות · אישור קופה</span></div><div class="list small"><div class="fact"><span class="k">נמען</span><span class="v">נועה ברק</span><span class="src">הכתובת מהכרטיס</span></div></div><div class="note warn small">בהדמיה לא נשלח מייל. הבקשה מסומנת «פורסם בדף האישי» כדי שתוכלו לראות מה נועה רואה.</div>`,
      foot: '<button class="btn primary" data-dsend>שלח (בהדמיה)</button><button class="btn" data-dpv>מה נועה תראה</button>',
      onOpen: (d, close) => { d.querySelector('[data-dsend]').onclick = () => { S.sent = true; logIt('נשלחה בקשת «השלמת מידע» · פורסם בדף האישי'); save(); close(); render(); P.toast('פורסם בדף האישי של נועה (בהדמיה)'); }; d.querySelector('[data-dpv]').onclick = () => { S.sent = true; logIt('נשלחה בקשת «השלמת מידע» · פורסם בדף האישי'); save(); close(); setTimeout(() => go('portal'), 300); }; } });
  }
  function newRequest() {
    P.drawer({ eyebrow: 'בקשה חדשה · נועה ברק', title: 'מה רוצים להתחיל?',
      body: `<p class="small muted">התבניות מגיעות מ«המשרד › תבניות בקשות». תהליכי מס נפתחים גם מתוך תיק המס.</p><div class="list">${[['הערכת מס לשנה', 'קיימת: 2026'], ['דוח שנתי', 'קיים: 2025'], ['הצהרת הון', 'הכנה אפשרית בכל עת; מועד רק עם דרישה מתועדת'], ['בקשת מסמכים', 'מהספרייה']].map(([n, d]) => `<div class="fact"><span class="k"><strong>${n}</strong><br><span class="xs muted">${d}</span></span><span></span><span class="src"><span class="notdemo">לא בהדגמה</span></span></div>`).join('')}</div>` });
  }

  // סרגל, תפריט ומדריך
  document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => { closeMenu(); go(b.dataset.nav === 'clients' ? 'clients' : b.dataset.nav); }));
  const acctBtn = document.getElementById('acctBtn'), acctMenu = document.getElementById('acctMenu');
  function closeMenu() { acctMenu.hidden = true; acctBtn.setAttribute('aria-expanded', 'false'); }
  acctBtn.onclick = e => { e.stopPropagation(); const open = acctMenu.hidden; acctMenu.hidden = !open; acctBtn.setAttribute('aria-expanded', String(open)); if (open) acctMenu.querySelector('button').focus(); };
  document.addEventListener('click', e => { if (!acctMenu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !acctMenu.hidden) { closeMenu(); acctBtn.focus(); } });
  const gBtn = document.getElementById('guideBtn'), gPanel = document.getElementById('guidePanel');
  gBtn.onclick = () => { gPanel.hidden = !gPanel.hidden; gBtn.setAttribute('aria-expanded', String(!gPanel.hidden)); };
  document.querySelectorAll('[data-tour]').forEach(b => b.onclick = () => {
    gPanel.hidden = true; gBtn.setAttribute('aria-expanded', 'false');
    const t = b.dataset.tour;
    if (t === 'learn') go('topic', { topic: 'studyFund', ctx: null });
    else if (t === 'client') go('client', { tab: 'requests' });
    else if (t === 'office') go('office', { office: 'templates' });
    else go(t);
  });
  document.getElementById('resetDemo').onclick = () => { S = { ...FRESH, open: {}, answers: {}, log: [] }; save(); gPanel.hidden = true; go('clients'); P.toast('ההדמיה אופסה'); };
  render();
})();
</script>
</body>
</html>
