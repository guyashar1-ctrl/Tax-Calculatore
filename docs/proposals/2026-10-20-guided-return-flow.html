<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דוח שנתי בליווי</title>
<style>
:root{--page:#f8f7f5;--card:#fff;--bd:#e2e4e7;--bd2:#d3d6da;--tx:#25282d;--txb:#3b3f45;--tx2:#63686f;--tx3:#8e949b;--br:#3f5f8f;--br2:#34507a;--soft:#e8eef5;--soft-bd:#c6d4e6;
--ok:#24654e;--ok-bg:#eaf4ef;--ok-bd:#c2ddcf;--warn:#8a5b0f;--warn-bg:#fbf3e4;--warn-bd:#ecd9b0;--err:#a63a3a;--err-bg:#fbeded;--err-bd:#ecc8c8;--s1:#f5f4f2;--s3:#f1f0ee;
--pO:#2c4f86;--pO-bg:#e6eef9;--pN:#6b4a87;--pN-bg:#f2ecf7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--tx);font:15px/1.55 "Segoe UI",Heebo,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #e07a1f;outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;color:var(--txb)}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
p{margin:0}
ul,ol{margin:0}
.banner{background:var(--warn-bg);border-bottom:1px solid var(--warn-bd);color:#5c400c;font-size:13px;padding:7px 16px}
.top{display:flex;align-items:center;gap:22px;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 20px}
.logo{font:700 19px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.5px;color:var(--txb)}
.top .crumb{font-size:14px;color:var(--tx2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .crumb b{color:var(--txb);font-weight:600}
.sim{display:flex;gap:6px;align-items:center;padding:8px 20px;background:var(--s1);border-bottom:1px solid var(--bd);font-size:13px;overflow-x:auto;scrollbar-width:thin}
.sim .lbl{color:var(--tx2);white-space:nowrap}
.sim button{border:1px solid var(--bd2);background:var(--card);border-radius:999px;padding:4px 12px;min-height:34px;white-space:nowrap}
.sim button[aria-pressed=true]{background:var(--br);border-color:var(--br);color:#fff}
main{max-width:1240px;margin:0 auto;padding:16px 20px 90px}
.btn{border:1px solid var(--bd2);background:var(--card);border-radius:8px;padding:7px 14px;min-height:40px;line-height:1.3}
.btn:hover{background:var(--s1)}
.btn.main{background:var(--br);border-color:var(--br);color:#fff;font-weight:600}
.btn.main:hover{background:var(--br2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.main[disabled]{background:#9aaac0;border-color:#9aaac0;opacity:1}
.btn.link{border:0;background:none;color:var(--br);padding:4px 2px;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.btn.sm{min-height:34px;padding:4px 11px;font-size:13px}
.btn.ok{border-color:var(--ok-bd);color:var(--ok);background:var(--ok-bg)}
.chip{display:inline-block;border:1px solid;border-radius:999px;padding:1px 9px;font-size:12px;white-space:nowrap;line-height:1.6}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.c-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.c-err{background:var(--err-bg);color:var(--err);border-color:var(--err-bd)}
.c-blue{background:#e3ebf5;color:#2c4468;border-color:var(--soft-bd)}
.c-slate{background:#ebedef;color:#3b444e;border-color:#d6dae0}
.c-pull{background:#eef3ea;color:#3d5a24;border-color:#cbdcbc}
.who{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.7}
.who.client{background:var(--pO-bg);color:var(--pO)}.who.spouse{background:var(--pN-bg);color:var(--pN)}.who.both{background:#ebedef;color:#3b444e}
.demo{font-size:11px;color:#6f5a0c;background:#f7f0d3;border:1px solid #e8dda6;border-radius:4px;padding:0 5px;margin-inline-start:4px;white-space:nowrap;font-weight:400}
.muted{color:var(--tx2)}.small{font-size:13px}.tiny{font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.pad{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.notice{background:var(--soft);border:1px solid var(--soft-bd);border-radius:9px;padding:10px 12px;font-size:14px}
.notice.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.notice.ok{background:var(--ok-bg);border-color:var(--ok-bd)}
.sep{height:1px;background:var(--bd);margin:12px 0}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* 0 · מה הוחלט */
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.dec{list-style:none;padding:0;counter-reset:d}
.dec li{counter-increment:d;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.dec li:last-child{border-bottom:0}
.dec li::before{content:counter(d);flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--br);font-size:12px;font-weight:700;margin-top:1px}
.scope li{display:flex;gap:8px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--bd)}
.scope li:last-child{border-bottom:0}
.scope .k{font-weight:600;min-width:118px}
.scope ul{list-style:none;padding:0}

/* פס קבוע */
.strip{position:sticky;top:0;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:14px}
.strip .res{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0;flex:1}
.strip .big{font-size:20px;font-weight:700}
.strip .big.pos{color:var(--ok)}.strip .big.neg{color:var(--err)}
.strip .blocked{font-weight:600;color:var(--warn)}
.strip .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strip .delta{font-size:13px;border-radius:6px;padding:1px 7px;background:var(--s1)}
.strip .cnt{font-size:14px;white-space:nowrap}
.strip .cnt b{font-size:16px}
.bar{height:6px;background:#e9ecf1;border-radius:9px;overflow:hidden;width:110px}
.bar>i{display:block;height:100%;background:var(--br);border-radius:9px;transition:width .3s ease}

/* 1 · רשימה */
.listhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.listhead .sub{color:var(--tx2);font-size:14px;margin-top:2px}
.grp{margin-top:14px}
.grp>h2{font-size:15px;color:var(--tx2);font-weight:600;margin:0 2px 6px;display:flex;gap:8px;align-items:baseline}
.drow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--bd)}
.drow:first-child{border-top:0}
.drow .t{flex:1;min-width:0}
.drow .t b{font-weight:600}
.drow .t .s{display:block;font-size:13px;color:var(--tx2);margin-top:1px}
.drow .st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.drow.pull{background:#fbfcf9}
.drow.miss{background:#fffaf7}

/* 2 · מסמך */
.dochead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.docwork{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.docside{position:sticky;top:78px}
.paper{background:#fdfcf7;background-image:repeating-linear-gradient(0deg,rgba(60,50,20,.018) 0 1px,transparent 1px 3px),radial-gradient(circle at 20% 10%,rgba(0,0,0,.025),transparent 40%);border:1px solid #d9d5c8;border-radius:3px;padding:18px 18px 22px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 26px rgba(0,0,0,.07);font:13px/1.5 Arial,sans-serif;color:#2b2a27;position:relative;transform:rotate(-.3deg)}
.paper .scan{position:absolute;top:6px;left:8px;font-size:10.5px;color:#9b978c}
.paper .hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.paper .lg{flex:none;width:38px;height:38px;border:2px solid #5b5850;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#5b5850}
.paper .iss{font-size:12px;color:#55524a}
.paper .ttl{font-weight:700;font-size:14px;padding:6px 0;border-top:2px solid #444;border-bottom:1px solid #444;margin-bottom:10px}
.paper table{width:100%;border-collapse:collapse}
.paper td{border:1px solid #cfcabd;padding:5px 6px;vertical-align:top}
.paper td.amt{text-align:left;direction:ltr;font-family:"Courier New",monospace;font-weight:700;white-space:nowrap;width:1%}
.paper td.code{color:#7d796e;width:1%;font-size:11.5px;white-space:nowrap}
.paper tr.hl td{background:rgba(255,236,150,.35)}
.paper tr.focus td{background:rgba(224,122,31,.22)}
.paper .txt{line-height:1.8}
.paper .txt mark{background:rgba(255,236,150,.55);padding:0 2px}
.paper .txt mark.focus{background:rgba(224,122,31,.3)}
.paper .foot{margin-top:12px;font-size:11px;color:#8a867a;display:flex;justify-content:space-between;gap:8px}
.paper .stamp{border:2px solid rgba(63,95,143,.45);color:rgba(63,95,143,.65);border-radius:6px;padding:0 6px;transform:rotate(-6deg);font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:#e07a1f;color:#fff;font:700 11px/1 Arial,sans-serif;margin-inline-end:5px;padding:0 4px;vertical-align:1px}
.showdoc{display:none}
.entry h3{margin-bottom:2px}
.fields{display:grid;gap:12px;margin-top:10px}
.f label{display:block;font-size:14px;color:var(--txb);font-weight:600}
.f .meta{font-size:12px;color:var(--tx2);margin:1px 0 4px;display:flex;gap:6px;flex-wrap:wrap}
.f .meta .into{color:var(--br);font-weight:600}
.f input,.f select{width:100%;border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;min-height:44px;background:#fff}
.f input.amt{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.f input:focus,.f select:focus{outline:2px solid var(--soft-bd);border-color:var(--br)}
.f.bad input,.f.bad select{border-color:var(--err);background:var(--err-bg)}
.f .err{color:var(--err);font-size:12.5px;margin-top:3px}
.skipnote{font-size:13px;color:var(--tx2);background:var(--s1);border-radius:8px;padding:7px 10px;margin-top:10px}
.live{margin-top:12px;border:1px dashed var(--soft-bd);background:#f7f9fc;border-radius:9px;padding:8px 10px;font-size:13px}
.live b{font-weight:600}
.went{border:1px solid var(--ok-bd);background:var(--ok-bg);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.went .w{min-width:0}
.went .route{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}

/* 4 · סקירה */
.rvlist{display:grid;gap:10px}
.rv{border:1px solid var(--warn-bd);background:var(--warn-bg);border-radius:10px;padding:11px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rv .t{flex:1;min-width:220px}
.rv .t b{display:block}
.rv.done{border-color:var(--ok-bd);background:var(--ok-bg);padding:7px 14px}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start;margin-top:12px}
.pager{display:flex;gap:4px}
.pager button{border:1px solid var(--bd2);background:var(--card);border-radius:8px;min-width:52px;min-height:38px}
.pager button[aria-pressed=true]{background:var(--br);color:#fff;border-color:var(--br)}
.fscroll{overflow:hidden;border:1px solid var(--bd);border-radius:8px;background:#fff}
.fpage{position:relative;width:100%;aspect-ratio:595/842}
.fpage img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.mk{position:absolute;border:0;margin:0;background:transparent;outline:1px dotted rgba(63,95,143,.22);border-radius:2px;font:700 clamp(6px,1vw,11px)/1 Arial,sans-serif;direction:ltr;text-align:left;padding:0 0 0 3px;overflow:hidden;white-space:nowrap;color:#1c3d33;min-height:0}
.mk.ok{background:rgba(36,101,78,.17);outline:1.5px solid rgba(36,101,78,.75)}
.mk.rv{background:rgba(224,140,30,.28);outline:2px solid #d98a1c}
.mk.ms{background:rgba(166,58,58,.13);outline:2px solid rgba(166,58,58,.75)}
.mk.sel{outline:3px solid #e07a1f!important;z-index:2}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin:6px 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-inline-end:4px}
.panel{position:sticky;top:78px}
.panel .code{font:700 22px/1 Arial,sans-serif;color:var(--br)}
.panel .total{font:700 22px/1.2 Arial,sans-serif}
.src{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
.src .a{font-weight:700}
.panel-close{display:none}
.approve{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* 5 · סט */
.setgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.toc{list-style:none;padding:0}
.toc>li{border-top:1px solid var(--bd);padding:10px 0}
.toc>li:first-child{border-top:0}
.toc .sec{display:flex;gap:10px;align-items:baseline;font-weight:600}
.toc .sec .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--br);color:#fff;font-size:12px;flex:none}
.toc .items{list-style:none;padding:0;margin-top:4px;padding-inline-start:32px}
.toc .items li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-size:14px}
.toc .items li .pg{color:var(--tx2);font-size:12.5px;white-space:nowrap}
.letter{background:#fff;border:1px solid var(--bd2);border-radius:4px;padding:18px 20px;font-size:14px;line-height:1.7}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd);padding:5px}
.tbl td{border-bottom:1px solid var(--bd);padding:6px 5px;vertical-align:top}
.phone{width:340px;max-width:100%;background:#1b1d21;border-radius:30px;padding:9px;margin-inline:auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone .scr{background:#f6f7f9;border-radius:22px;padding:16px 14px;max-height:620px;overflow-y:auto}
.phone .firm{font-size:12px;color:var(--tx2)}
.btn-c{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;background:#2f6fde;color:#fff;width:100%}

/* חלון */
.backdrop{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:60;display:grid;place-items:center;padding:16px}
.dialog{background:var(--card);border-radius:14px;width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog.wide{width:min(860px,100%)}
.dialog .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card);z-index:1}
.dialog .db{padding:16px 18px}
.dialog .df{padding:12px 18px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mail{border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.mail .mh{background:var(--s1);padding:9px 12px;font-size:13px;border-bottom:1px solid var(--bd)}
.mail .mh div{display:flex;gap:6px}.mail .mh .k{color:var(--tx2);min-width:42px}
.mail .mb{padding:16px 16px 18px;font-size:15px;line-height:1.7}
.mail .mb ul{padding-inline-start:20px;margin:6px 0}
.mail .cta{display:inline-block;background:#2f6fde;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;margin:10px 0 6px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#25282d;color:#fff;border-radius:9px;padding:10px 16px;font-size:14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:80}
.toast[hidden]{display:none}

/* נספחים · מונה · בקרות */
.c-ax{background:#efeaf6;color:#553b78;border-color:#d9cdea}
.went .lvl{display:flex;gap:8px;align-items:baseline;margin-top:5px}
.went .lk{flex:none;font-size:12px;font-weight:700;color:var(--ok);min-width:64px}
.went .lvl>:last-child{flex:1;min-width:0}.went .lvl .route{margin-top:0}.went .lvl .route.col{flex-direction:column;gap:2px}
.opened{margin-top:6px;border:1px solid #d9cdea;background:#f6f2fb;color:#3f2b5c;border-radius:8px;padding:5px 9px;font-size:13.5px;font-weight:600}
.axnote{border:1px solid #d9cdea;background:#f6f2fb;border-radius:9px;padding:8px 11px;font-size:13.5px;margin-top:10px}
.cnt-chip{background:#ebedef;color:#3b444e;border-color:#d6dae0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-top:16px}
.tabs button{border:1px solid transparent;border-bottom:0;background:none;border-radius:8px 8px 0 0;padding:7px 13px;min-height:40px;color:var(--tx2);margin-bottom:-1px}
.tabs button[aria-selected=true]{background:var(--card);border-color:var(--bd);color:var(--txb);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.chk:first-child{border-top:0}
.chk .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.chk.ok .ic{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.chk.fail .ic{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.chk.wait .ic{background:var(--s1);color:var(--tx2);border:1px solid var(--bd2)}
.chk .t{flex:1;min-width:0}
.chk .v{font-size:12.5px;color:var(--tx2)}
.mk.ax{box-shadow:inset 0 0 0 2px #7b5aa6}
.mk.hash::before{content:'#';color:#7b5aa6;margin-inline-end:2px}
.tblwrap{overflow-x:auto}
.pir{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.pir col.cn{width:104px}
.pir thead th.n{white-space:normal;vertical-align:bottom}
.pir th{font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd2);padding:5px;text-align:start}
.pir th.n,.pir td.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap;width:1%}
.pir td{border-bottom:1px solid var(--bd);padding:5px}
.pir tr.fh td{background:var(--s1);font-weight:600;color:var(--txb);border-top:1px solid var(--bd2)}
.pir tr.tot td{font-weight:700;border-bottom:1px solid var(--bd2)}
.pir tr.adj td{color:#553b78}
.pir tr.ln{cursor:pointer}
.pir tr.ln:hover td,.pir tr.ln.sel td{background:#f3f6fb}
.pir .lnb{border:0;background:none;padding:0;text-align:start;color:var(--br);text-decoration:underline;text-underline-offset:3px;min-height:28px}
.axpage{background:#fff;border:1px solid var(--bd2);border-radius:4px;padding:14px 16px}
.axpage .axh{border-bottom:2px solid #444;padding-bottom:6px;margin-bottom:8px}
.axpage h4{margin:10px 0 4px;font-size:13.5px;color:var(--txb)}
.axrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--bd);border-radius:6px;padding:6px 9px;margin-top:5px;font-size:13.5px}
.axrow.hl{border-color:#7b5aa6;background:#f6f2fb;box-shadow:0 0 0 2px rgba(123,90,166,.25)}
.axrow .ac{font:700 12px/1 Arial,sans-serif;color:#7b5aa6;border:1px solid #d9cdea;border-radius:4px;padding:2px 5px;margin-inline-end:6px}
.pgfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bd);margin-top:12px;padding-top:6px;font-size:11.5px;color:var(--tx2)}
.toc .items li .ttl2{min-width:0}
.req{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--bd)}
.req:first-child{border-top:0}
.req .t{flex:1;min-width:200px}
.req .t b{font-weight:600}
.req .t .s{display:block;font-size:13px;color:var(--tx2);margin-top:1px}
.visually{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.decide{border:1px solid var(--warn-bd);background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px}
.rule{border:1px solid var(--ok-bd);background:var(--ok-bg);border-radius:10px;padding:10px 12px;font-size:14px}
.rule b{font-weight:700}
.annrow{display:flex;gap:8px;align-items:baseline;margin-top:6px}
.annrow>b{flex:none}
.annl{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.annl .na{color:var(--tx2)}
.annl .rest{color:var(--tx2);font-size:12.5px}
.f .meta .ann{color:#553b78}
.pir .who{font-size:11px;margin-inline-start:4px}
/* נספחים — הטופס הרשמי */
.mk.txt{direction:rtl;text-align:right;padding:0 3px 0 0;font-weight:600}
.mk.chk{text-align:center;padding:0;font-size:clamp(8px,1.3vw,14px)}
.mk.fx{pointer-events:none;outline:0;background:transparent;color:#1d3a6b}
.axcnt{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;margin-top:8px;font-size:13.5px;background:var(--card)}
.axcnt.hl{border-color:#7b5aa6;background:#f6f2fb;box-shadow:0 0 0 2px rgba(123,90,166,.25)}
/* מחיקה לבדיקה */
.menuwrap{position:relative;display:inline-block}
.kebab{min-width:40px;font-size:17px;font-weight:700;letter-spacing:1px}
.menu{position:absolute;top:calc(100% + 4px);inset-inline-end:0;z-index:20;background:var(--card);border:1px solid var(--bd2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;min-width:170px}
.menu button{display:block;width:100%;text-align:start;border:0;background:none;border-radius:7px;padding:8px 10px;min-height:40px;font-size:14px;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--err-bg)}
.menu .dangert{color:var(--err);font-weight:600}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:600}
.btn.danger:hover{background:#8c2f2f}
.dellist{margin:6px 0 0;padding-inline-start:20px;font-size:14px}
.dellist li{padding:2px 0}
/* חישוב השומה */
.strip .res{cursor:pointer}
.asmt{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:340px}
.asmt col.lab{width:34%}
.asmt th,.asmt td{border-bottom:1px solid var(--bd);padding:4px 5px;text-align:start;vertical-align:top;font-weight:400}
.asmt thead th{font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd2)}
.asmt td{text-align:left}
.asmt td.txtc{text-align:start;font-size:13px;line-height:1.6}
.asmt td.txtc p+p{margin-top:4px}
.asmt tr.sh th{background:var(--s1);font-weight:600;color:var(--txb);padding-top:6px}
.asmt tr.sh .n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:var(--br);color:#fff;font-size:11px;margin-inline-end:6px}
.asmt tr.tot td,.asmt tr.tot th{font-weight:700}
.asmt th b{font-size:13px}
.asmt tr.bal td,.asmt tr.bal th{font-weight:700;background:var(--ok-bg)}
.asb{border:0;background:none;padding:2px 3px;min-height:28px;color:var(--br);font:inherit;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-decoration:underline dotted;text-underline-offset:3px;border-radius:4px;text-align:left}
.asb.sel{background:#fde9d4;outline:2px solid #e07a1f}
.asb.wide{direction:rtl;text-align:start}
.asb .pd,.asmt .pd{display:block;font-size:11px;color:var(--tx2);text-decoration:none;font-weight:400}
.ctype{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-start;direction:rtl}
.asmt td:has(.ctype){text-align:start}

@media (max-width:900px){
 main{padding:12px 16px 90px}
 .top{gap:12px;padding:10px 16px}
 .sim{padding:8px 16px}
 .intro,.setgrid{grid-template-columns:1fr}
 .docwork{grid-template-columns:1fr}
 .docside{position:static}
 .showdoc{display:inline-flex}
 .docside.closed .paper{display:none}
 .formwrap{grid-template-columns:1fr}
 .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;max-height:60vh;overflow:auto;border-top:1px solid var(--bd2);box-shadow:0 -6px 20px rgba(0,0,0,.15)}
 .panel .card{border:0;border-radius:14px 14px 0 0}
 .panel.empty{display:none}
 main.sheet{padding-bottom:64vh}
 .panel-close{display:inline-flex}
 .btn{min-height:44px}
 .drow{flex-wrap:wrap;padding:11px 12px}
 .drow .st{justify-content:flex-start;width:100%}
 .strip{padding:8px 12px;gap:8px}
 .strip .big{font-size:18px}
 .bar{width:70px}
 .paper{transform:none}
 .strip{flex-wrap:nowrap;align-items:flex-start}
 .strip .res{gap:0 8px}
 .strip .left{flex:none}
 .strip .bar{display:none}
 .strip .res .small,.strip .delta{font-size:12px}
 .strip .big{font-size:17px}
 .strip .cnt{font-size:13px}
 .strip .cnt b{font-size:14px}
}
@media (max-width:600px){.letter{padding:12px 10px}.dialog .db{padding:12px}.pir{font-size:12px}.pir col.cn{width:60px}.pir td,.pir th{padding:4px 3px}.pir th.n{font-size:11px}.phone{background:none;padding:0;box-shadow:none}.phone .scr{border:1px solid var(--bd);border-radius:14px;max-height:none}}
</style>
</head>

function fieldAnn(d,f,a){if(f.ann)return f.ann;const cs=String(f.to).match(/(?<!\d)\d{3}(?!\d)/g)||[];const rs=a.mine.filter(r=>r.code&&cs.includes(r.code));const out=[];

 return out.length?[...new Set(out)].join(' + '):'אין'}

/* 0 · מה הוחלט */
function introHtml(){const DEC=['נכנסים לדוח דרך רשימת המסמכים, לפי סדר ההזנה ועם «כמה נשארו» — לא דרך טופס 1301.','בתוך מסמך: המסמך מצד אחד והשדות מהצד השני; מה שמקלידים נראה מיד בדוח. ובכל מסמך שורה «נספח:» — לאיזה נספח זה הולך, או «אין» ולמה.','מסמכים שהמשרד מוציא בעצמו (ב״ל, שומה, מקדמות) — באותה רשימה, «אתה מוציא», ונספרים ב«נשארו».','סדר הרשימה לפי 1301: הכנסות ← ריבית והשקעות ← זיכויים וניכויים, ובכל שורה «של מי».','מסמך שלא הגיע: «חסר · ביקשנו ב…». התזכורת יוצאת רק מ«בקשות» — מהדף של הלקוח («שלח מייל…»), עם המייל לצפייה לפני שליחה. המסך הפנימי רק מוביל לשם.','בזמן ההזנה פס קבוע: ההחזר או התשלום הצפוי, ו«עוד N מסמכים». כשחסר נתון — הפס אומר, לא ממציא מספר.','אחרי המסמך האחרון: קודם סקירה, ואחריה הסט — מכתב מלווה ממוספר (= תוכן העניינים) ← 1301 ← נספח פירוטים (כשיש שדה עם יותר ממקור אחד לאדם) ← נספחים ← מסמכים ← דף התאמה — ו«שלח לחתימה».','בסקירה: למעלה «דברים לבדיקתך», אחריהם «בקרות», ואז 1301 עם הסימונים; לחיצה על סכום מראה מאיזה מסמך הגיע.','מסמך שנכנס גם לנספח (למשל 867א+ב ← נספח ג׳) מראה שלוש רמות: שדה 1301 ושל מי, שורת הנספח, והמונה («106 מס׳ 2 מתוך 2»). בסקירה — מעבר שדה ↔ נספח; שדה שיש בו לאדם יותר ממקור אחד לאותה הכנסה (למשל שני טפסי 106) — ב«נספח פירוטים».','נספחים (1320, 1322) מוצגים כטופס הרשמי של רשות המסים לשנת 2025 — כמו 1301: הסכומים בתוך השדות של הטופס, לחיצה על סכום מראה ממה הוא מורכב, והמעבר שדה ↔ נספח מגיע למקום בטופס. נספח הפירוטים הוא נספח של המשרד — אין לו טופס רשמי.','מחיקת הדוח לבדיקות — מכל מקום שבו מופיעה השורה, עם אישור שמפרט מה נמחק; התשובות והקבצים של הבדיקה לא משפיעים על הדוח הבא. <button type="button" class="btn link small" data-act="go" data-v="tax">ראו במסך 6</button>'];
 return`<h1>דוח שנתי בליווי — המסלול כולו</h1><p class="muted" style="margin:4px 0 14px">מה רואים מהרגע שעמרי ונועה העלו את המסמכים ועד שהדוח נשלח אליהם לחתימה. עברו בין המסכים בפס למעלה, או התחילו מהמסמכים.</p>
 <div class="intro"><section class="card pad" aria-labelledby="h-dec"><h2 id="h-dec">מה הוחלט (20.10)</h2><ol class="dec" style="margin-top:6px">${DEC.map(t=>`<li><span>${t}</span></li>`).join('')}</ol>
 <div class="rule" style="margin-top:10px" data-rule="pir"><b>נספח פירוטים — מתי הוא נוצר:</b> כשלאדם אחד יש יותר ממקור אחד לאותה הכנסה באותו שדה — בעיקר יותר מטופס 106 אחד (שני מעסיקים). הנספח מפרט ממה כל שדה כזה מורכב, כלומר מאיפה ההכנסה. כשהכלל מתקיים הוא נכנס לסט תמיד, בגרסת לקוח: בלי סטטוסים פנימיים ובלי מספרי תיק של המשלמים. מקור אחד לשדה — אין נספח.<br><span class="tiny muted">בהדמיה: לעמרי שני טפסי 106 (מערכות צפון ומרום שירותים), ולכן נוצר נספח.</span></div></section>
 <div class="stack"><section class="card pad" aria-labelledby="h-scope"><h2 id="h-scope">מה ייכלל בביצוע</h2><p class="tiny muted" style="margin-bottom:4px">הערכה — יפורט לפני ביצוע</p><ul class="scope"><li><span class="k">האתר</span><span>כן — הרשימה, מסך המסמך עם הקישור לנספחים, הפס, הסקירה עם הבקרות וחישוב השומה, הנספחים כטופס הרשמי, נספח הפירוטים, הסט, ומחיקת הדוח מ-⋯.</span></li><li><span class="k">פונקציות שרת</span><span>משתמשים במה שקיים: מייל ללקוח יוצא רק מ«בקשות» — מהדף של הלקוח (send-step-email).</span></li><li><span class="k">מסד בייצור</span><span>כנראה מיגרציה אחת — מצב «אתה מוציא», ערך ידני (#) עם נימוק, ומחיקת דוח עם עותק נסתר.</span></li><li><span class="k">העובד במחשב המשרד</span><span>לא.</span></li></ul></section>
 <div class="notice small">המספר בפס הוא <b>נוסחת הדגמה</b> שמגיעה בסוף להחזר מהתרגיל (22,337 ₪). במימוש — מהמנוע הקיים של הערכת המס.</div>
 <div class="actions"><button type="button" class="btn main" data-act="go" data-v="list">להתחיל: המסמכים</button></div></div></div>`}

function stripHtml(){const rem=remaining(),n=DOCS.length;const bl=blockers();const cur=S.scr==='doc'?S.doc:null;
 const val=calc(factsWith(cur,true));const base=cur?calc(factsWith(null,false)):null;const delta=cur&&base!==null?val-base:0;
 let res;
 if(bl.length&&!S.partial){const miss=bl.filter(d=>status(d.id)==='miss'),pull=bl.filter(d=>status(d.id)==='pull');const first=miss[0]?miss[0].short:pull[0].title;const more=bl.length-1;const pullMore=pull.length-(miss[0]?0:1);
  res=`<span class="blocked" data-strip="blocked">אין עדיין חישוב ודאי — חסר ${esc(first)}</span>${more?`<span class="small muted">ועוד ${more}${pullMore?` · מהם ${pullMore} שאתה מוציא`:''}</span>`:''}<button type="button" class="btn link small" data-act="partial">הצג בינתיים לפי מה שהוזן</button>`}
 else{res=`<span class="big ${val>=0?'pos':'neg'}" data-strip="value">${val>=0?'החזר צפוי':'תשלום צפוי'} <span class="num">${fmt(Math.abs(val))}</span> ₪</span><span class="demo">להדגמה</span>${bl.length?`<span class="small muted">בינתיים · בלי ${bl.length} מסמכים שעוד לא הגיעו</span><button type="button" class="btn link small" data-act="partial">הסתר</button>`:`<span class="small muted">${rem?'לפי מה שהוזן עד עכשיו':'כל המסמכים הוזנו'}</span>`}${cur&&delta?`<span class="delta">המסמך הזה: <span class="num">${delta>0?'+':'−'}${fmt(Math.abs(delta))}</span> ₪</span>`:''}`}
 return`<div class="strip" id="strip" role="status" aria-live="polite"><div class="res" data-act="toCalc" title="פתח את חישוב השומה">${res}</div><div class="left">${S.scr==='review'&&S.rtab==='calc'?'':'<button type="button" class="btn link small tocalc" data-act="toCalc">חישוב השומה ›</button>'}<span class="cnt">${rem?`עוד <b>${rem}</b> מסמכים`:'<b>הכול הוזן</b>'}</span><span class="bar" aria-hidden="true"><i style="width:${Math.round((n-rem)/n*100)}%"></i></span></div></div>`}

function clientSignHtml(r){const n=r==='client'?'עמרי':'נועה';return`<section class="card pad" aria-label="מה ${n} רואה"><p class="tiny muted" style="margin-bottom:8px">כך זה נראה אצל ${n} — הדף האישי, בטלפון</p><div class="phone"><div class="scr"><p class="firm">המשרד של גיא · הדף האישי</p><h3 style="margin-top:6px">שלום ${n}, נשאר לחתום על הדוח השנתי</h3><p class="small" style="margin-top:4px">זה הריכוז של הדוח שהכנו. עברו על התשובות, ואם הכול נכון — חתמו.</p>
 <details style="margin:10px 0"><summary class="small" style="cursor:pointer;color:#2f6fde;font-weight:600">פתח את עמוד הריכוז</summary><div style="margin-top:8px">${summaryHtml(1)}</div></details>
 <form data-act="sign" data-v="${r}" class="stack"><label class="small" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="consent" style="margin-top:4px;width:18px;height:18px"> קראתי. בשנת 2025 לא היו לי הכנסות נוספות, והפרטים נכונים ומלאים.</label>
 <div><div class="small" style="font-weight:600;margin-bottom:4px" id="pad-l">החתימה שלך</div><canvas id="pad" width="600" height="180" style="width:100%;height:120px;border:1px dashed var(--bd2);border-radius:10px;background:#fff;touch-action:none;display:block" role="img" aria-labelledby="pad-l"></canvas><button type="button" class="btn link small" data-act="clearPad">נקה</button></div>
 <button class="btn-c" type="submit">חתום</button><button type="button" class="btn" data-act="closeSign">סגור</button></form></div></div></section>`}
function signModal(){return`<div class="dh"><h2 id="dlg-t">שליחה לחתימה — לפני שליחה</h2><button type="button" class="btn sm" data-act="closeModal" aria-label="סגור">✕</button></div>
 <div class="db"><div class="mail"><div class="mh"><div><span class="k">אל:</span><span>עמרי ברק, נועה ברק · כל אחד מקבל את שלו</span></div><div><span class="k">נושא:</span><b>הדוח השנתי 2025 מוכן — נשאר לחתום</b></div></div>
 <div class="mb"><p>שלום עמרי ונועה,</p><p>סיימנו להכין את הדוח השנתי שלכם לשנת 2025.</p><p>מה נשאר: כל אחד מכם נכנס לדף האישי, עובר על עמוד הריכוז וחותם. זה לוקח כמה דקות.</p><span class="cta" role="presentation">לדף האישי — לחתימה</span><p>אם משהו לא נראה נכון, כתבו לנו לפני שאתם חותמים.</p><p>תודה,<br>גיא · המשרד</p></div></div>
 <p class="tiny muted" style="margin-top:10px">יוצא מתוך הבקשה «דוח שנתי 2025» ונרשם שם. הפריט «לחתום על הדוח השנתי 2025» נוסף לדף של עמרי ולדף של נועה.</p></div>
 <div class="df"><span class="tiny muted">גרסה 1 · מאושרת</span><div class="actions"><button type="button" class="btn" data-act="closeModal">ביטול</button><button type="button" class="btn main" data-act="sendSignNow">שלח</button></div></div>`}
function previewModal(k,back){let title,body;const pp=setPages();const x=pp.map[k];
 if(k==='cover'){title='מכתב מלווה — תוכן העניינים';body=coverHtml()+pgFoot(x.from)}
 else if(k==='sum'){title='עמוד הריכוז';body=summaryHtml()+pgFoot(x.from)}
 else if(k==='1301'){title='טופס 1301 · 2025';const fm=fieldMap();body=[2,3,4].map(p=>`<div class="fscroll" style="margin-bottom:4px"><div class="fpage"><img src="${IMG['p'+p]}" alt="טופס 1301, עמוד ${p}">${markers(p,fm).replace(/data-act="sel"/g,'tabindex="-1" disabled')}</div></div>${pgFoot(x.from+p-1)}`).join('<div style="height:10px"></div>')+'<p class="tiny muted" style="margin-top:8px">עמוד 1 (פרטים אישיים) הושמט בהדמיה.</p>'+Object.keys(MANUAL).filter(c=>isManual(fm.get(c))).map(c=>`<p class="tiny" style="margin-top:4px" data-footnote># שדה ${c} — ערך שהוזן ידנית במקום החישוב (${fmt(MANUAL[c].to)} ₪${D}). נימוק: ${MANUAL[c].why}. ${MANUAL[c].by}.</p>`).join('')}
 else if(k==='pir'){title='נספח פירוטים';body=`<div class="letter">${pirHtml('set')}</div>${pgFoot(x.from,x.to)}`}
 else if(k==='recon'){title='דף התאמה — סכומי הנספחים מול 1301';body=reconHtml()+pgFoot(x.from)}
 else if(k.startsWith('ax:')){const f=k.slice(3);title=ANX[f].name+' — '+ANX[f].title;body=annexPageHtml(f,'set')+(ANX[f].online?'<p class="tiny muted" style="margin-top:6px">משודר — לא מצורף: עובר בשידור המקוון; כאן לעותק התיק ולבדיקה.</p>':'')+pgFoot(x.from,x.to)}
 else{const d=DOC[k.slice(4)];title=d.title;body=paperHtml(d)+(x?pgFoot(x.from,x.to):'')}
 return`<div class="dh"><h2 id="dlg-t">${title}</h2><button type="button" class="btn sm" data-act="closeModal" aria-label="סגור">✕</button></div><div class="db">${back?`<button type="button" class="btn link small" data-act="preview" data-v="${back}" style="margin-bottom:6px">› חזרה ל${labelOf(back).split(' — ')[0]}</button>`:''}${body}</div><div class="df"><span class="tiny muted">תצוגה בהדמיה · ${x?pgTxt(x):''}</span><button type="button" class="btn" data-act="closeModal">סגור</button></div>`}
let lastFocus=null;
function renderModal(){const m=S.modal;if(!m){modal.innerHTML='';return}
 const inner=m.t==='reqMail'?reqMailModal():m.t==='sign'?signModal():m.t==='del'?delModal():previewModal(m.v,m.back);
 modal.innerHTML=`<div class="backdrop" data-act="backdrop"><div class="dialog ${m.t==='preview'?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t">${inner}</div></div>`;
 const f=modal.querySelector('[data-autofocus]')||modal.querySelector('.df .btn.main:not([disabled])')||modal.querySelector('.dh .btn');f&&f.focus()}
function openModal(t,v,back){if(!S.modal)lastFocus=document.activeElement;S.modal={t,v,back};render()}
function closeModal(){const was=S.modal&&S.modal.t;S.modal=null;render();if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus();else if(was==='del')document.querySelector('[data-act=menu]')?.focus()}

/* ── ניווט ── */
const firstTodo=after=>{const i=after?DOCS.findIndex(x=>x.id===after):-1;for(let k=1;k<=DOCS.length;k++){const d=DOCS[(i+k+DOCS.length)%DOCS.length];if(status(d.id)==='todo'&&d.id!==after)return d.id}return null};
function go(v){S.scr=v;S.sel=null;S.pirSel=null;if(v!=='doc')S.last=v==='review'?S.last:null;render();window.scrollTo({top:0})}
function openDoc(id){S.doc=id;S.scr='doc';S.docOpen=false;S.modal=null;render();window.scrollTo({top:0})}
function nextFromList(){const n=firstTodo(null);if(n)return openDoc(n);if(!remaining())return go('review');const b=blockers();note(`כל מה שהגיע הוזן. נשארו: ${b.map(d=>d.title).join(' · ')}.`)}
function fillAll(){DOCS.forEach(d=>{if(!S.done[d.id]){S.avail[d.id]=true;S.done[d.id]=demoVals(d);S.meta[d.id]='גיא · היום '+nowHM()}});S.draft={};S.err={};note('כל המסמכים מולאו בערכי הדוגמה — כולל מה שחסר ומה שאתה מוציא.');render()}
function jumpField(c){S.scr='review';S.rtab='1301';S.axSel=null;S.asSel=null;const a=ANCH.find(x=>x[0]===c);if(a)S.page=a[1];S.sel=c;S.pirSel=null;render();const el=document.querySelector('.mk.sel');el&&el.scrollIntoView({block:'center'})}
function invalidate(){if(S.approved){S.approved=false;S.sent=false;S.signed={};S.as=null;return true}return false}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');
 if(S.menu&&!(b&&['menu','delAsk'].includes(b.dataset.act))){S.menu=null;render();if(!b)return}
 if(!b||b.tagName==='FORM'||b.tagName==='SELECT'||b.tagName==='INPUT')return;const a=b.dataset.act,v=b.dataset.v;
 if(a==='backdrop'){if(ev.target===b)closeModal();return}
 if(b.disabled)return;
 ev.preventDefault();
 if(a==='sim'){S.modal=null;if(v==='doc'){openDoc(S.doc&&!S.done[S.doc]?S.doc:(firstTodo(null)||'f106o'))}else if(v==='remind')go('requests');else go(v)}
 else if(a==='go'){S.modal=null;go(v)}
 else if(a==='note')note(v);
 else if(a==='next')nextFromList();
 else if(a==='fillAll')fillAll();
 else if(a==='open')openDoc(v);
 else if(a==='attach'){S.avail[v]=true;note(`צורף: ${DOC[v].title}. עכשיו הוא ברשימת ההזנה — ועדיין נספר ב«נשארו».`);render()}
 else if(a==='toRequests')go('requests');
 else if(a==='reqMail')openModal('reqMail');
 else if(a==='sendReq'){const ms=missing();if(!ms.length)return;ms.forEach(d=>S.reminded[d.id]=true);S.reqMail=nowHM();S.modal=null;render();note('נשלח · נרשם ב«בקשות» — «דוח שנתי 2025»')}
 else if(a==='arrive'){S.avail[v]=true;note(`הדגמה: עמרי העלה את ${DOC[v].short} בדף האישי. מחכה להזנה.`);render()}
 else if(a==='closeModal')closeModal();
 else if(a==='partial'){S.partial=!S.partial;refreshStrip()}
 else if(a==='toggleDoc'){S.docOpen=!S.docOpen;render()}
 else if(a==='demo'){S.draft[v]=demoVals(DOC[v]);delete S.err[v];render()}
 else if(a==='skip'){const n=firstTodo(S.doc);if(n)openDoc(n);else{note('אין עוד מסמך שמחכה להזנה.');go('list')}}
 else if(a==='closeWent'){S.last=null;render()}
 else if(a==='sel'){S.sel=v;render()}
 else if(a==='unsel'){S.sel=null;render()}
 else if(a==='page'){S.page=+v;S.sel=null;render()}
 else if(a==='rtab'){S.rtab=v;S.sel=null;S.pirSel=null;S.axSel=null;S.asSel=null;render();document.getElementById('tp')?.scrollIntoView({block:'start'})}
 else if(a==='axToggle'){S.axOn=!S.axOn;render()}
 else if(a==='toAnnex'){S.rtab='ax'+v;S.axSel=b.dataset.k;S.sel=null;render();const el=document.querySelector('.axmk.sel,.axcnt.hl');el&&el.scrollIntoView({block:'center'})}
 else if(a==='axJump')jumpField(v);
 else if(a==='asSel'){if(/^[0-9]{3}$/.test(v)){S.sel=S.sel===v?null:v;S.asSel=null}else{S.asSel=S.asSel===v?null:v;S.sel=null}render()}
 else if(a==='asUnsel'){S.asSel=null;render()}
 else if(a==='toCalc'){S.modal=null;S.scr='review';S.rtab='calc';S.sel=null;S.asSel=null;S.pirSel=null;render();document.getElementById('tp')?.scrollIntoView({block:'start'})}
 else if(a==='menu'){S.menu=S.menu===v?null:v;render();document.querySelector('.menu [role=menuitem]')?.focus()}
 else if(a==='delAsk'){S.menu=null;openModal('del')}
 else if(a==='delNow'){S.deleted=true;S.fresh=false;S.delAt=nowHM();S.modal=null;S.menu=null;render();note('הדוח נמחק — אפשר לפתוח דוח חדש');document.querySelector('[data-act=newReport]')?.focus()}
 else if(a==='newReport'){const sc=S.scr;initS();S.scr=sc;S.fresh=true;render();note('נפתח דוח שנתי 2025 חדש — ריק, בלי התשובות והקבצים של הבדיקה')}
 else if(a==='resetDemo'){const sc=S.scr;initS();S.scr=sc;render();note('חזרה לדוח לדוגמה — ההדמיה מתחילה מההתחלה')}
 else if(a==='axSel'){S.axSel=S.axSel===v?null:v;render()}
 else if(a==='axUnsel'){S.axSel=null;render()}
 else if(a==='pirSel'){S.pirSel={doc:v,code:b.dataset.c,m:b.dataset.m};render()}
 else if(a==='pirUnsel'){S.pirSel=null;render()}
 else if(a==='pirDoc'){S.modal={t:'preview',v:'doc:'+v,back:'pir'};render()}
 else if(a==='decide'){const k=b.dataset.k;S.rv[k]=v;S.rvMeta[k]='גיא · היום '+nowHM();if(invalidate())note('שינוי אחרי אישור — הדוח חזר לבדיקה.');else note('נרשם: '+RVS.find(r=>r.k===k).opts.find(o=>o[0]===v)[1]);render()}
 else if(a==='undecide'){S.rv[b.dataset.k]=null;invalidate();render()}
 else if(a==='approve'){if(remaining()||openRv().length||checks().some(c=>c.st==='fail'))return;S.approved=true;S.gen='20.10.2026 · '+nowHM();note('הדוח אושר — גרסה 1 נעולה. הסט הופק עכשיו.');render()}
 else if(a==='preview'){if(S.modal&&S.modal.t==='preview'){S.modal={t:'preview',v};render()}else openModal('preview',v)}
 else if(a==='sendSign'){if(!S.approved)return;openModal('sign')}
 else if(a==='sendSignNow'){S.sent=true;S.modal=null;render();note('נשלח · נוסף לדף של עמרי ושל נועה · נרשם בבקשה «דוח שנתי 2025»')}
 else if(a==='signAs'){S.as=v;render();document.getElementById('pad')?.scrollIntoView({block:'center'})}
 else if(a==='closeSign'){S.as=null;render()}
 else if(a==='clearPad'){const c=document.getElementById('pad');c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.ink='';note('המשטח נוקה.')}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.modal)closeModal();else if(S.menu){const w=S.menu;S.menu=null;render();document.querySelector('[data-act=menu][data-v="'+w+'"]')?.focus()}});
document.addEventListener('input',ev=>{const t=ev.target;if(!t.dataset||!t.dataset.fk||S.scr!=='doc')return;const id=S.doc;(S.draft[id]=S.draft[id]||{...(S.done[id]||{})})[t.dataset.fk]=t.value;refreshStrip()});
document.addEventListener('change',ev=>{const t=ev.target;if(!t.dataset||!t.dataset.fk||S.scr!=='doc')return;const id=S.doc;(S.draft[id]=S.draft[id]||{...(S.done[id]||{})})[t.dataset.fk]=t.value;refreshStrip()});
const hl=(n,on)=>{document.querySelectorAll('.paper [data-n]').forEach(x=>x.classList.toggle('focus',on&&x.dataset.n===n))};
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.dataset&&t.dataset.fk!==undefined&&t.dataset.n)hl(t.dataset.n,true)});
document.addEventListener('focusout',ev=>{const t=ev.target;if(t.dataset&&t.dataset.fk!==undefined)hl('',false)});
document.addEventListener('submit',ev=>{const f=ev.target;ev.preventDefault();const a=f.dataset.act;
 if(a==='save'){const id=f.dataset.doc,d=DOC[id];const raw=S.draft[id]||S.done[id]||{};const v={},e={};
  for(const fl of d.fields){const r=raw[fl.k];if(fl.type==='choice'||fl.type==='date'){if(!r)e[fl.k]='חובה לבחור / למלא';v[fl.k]=r}else{const n=num(r);if(r===undefined||r==='')e[fl.k]='חובה — אם אין במסמך, להזין 0';else if(isNaN(n))e[fl.k]='סכום בספרות בלבד';else if(n<0)e[fl.k]='סכום לא יכול להיות שלילי';v[fl.k]=n}}
  if(!Object.keys(e).length)Object.assign(e,d.check(v));
  if(Object.keys(e).length){S.err[id]=e;render();const x=document.querySelector('.f.bad input,.f.bad select');x&&x.focus();return}
  if(invalidate())note('שינוי אחרי אישור — הדוח חזר לבדיקה.');
  const before=Object.keys(ANX).filter(axOpen);
  S.done[id]=v;S.meta[id]='גיא · היום '+nowHM();delete S.draft[id];delete S.err[id];
  const opened=Object.keys(ANX).filter(k=>axOpen(k)&&!before.includes(k));
  S.last={doc:id,rows:d.route(v),opened};
  const n=firstTodo(id);
  if(n)openDoc(n);
  else if(!remaining()){S.scr='review';render();window.scrollTo({top:0});note('המסמך האחרון הוזן — עכשיו סקירה.')}
  else{S.scr='list';render();window.scrollTo({top:0});note('כל מה שהגיע הוזן. נשארו מסמכים שעוד לא אצלנו.')}}
 else if(a==='sign'){const c=document.getElementById('pad');if(!f.querySelector('#consent').checked){note('צריך לסמן «קראתי… הפרטים נכונים ומלאים».');return}if(!c.dataset.ink){note('חסרה חתימה במשטח.');return}
  S.signed[f.dataset.v]='היום '+nowHM();S.as=null;note(S.signed.client&&S.signed.spouse?'שניהם חתמו. ה-PDF החתום נשמר בתיק.':'החתימה נשמרה.');render()}
});
let drawing=null;
document.addEventListener('pointerdown',e=>{if(e.target.id!=='pad')return;const c=e.target,r=c.getBoundingClientRect(),g=c.getContext('2d');g.lineWidth=3;g.lineCap='round';g.strokeStyle='#14213d';drawing={c,g,r};g.beginPath();g.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);c.setPointerCapture&&c.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drawing)return;const {c,g,r}=drawing;g.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);g.stroke();c.dataset.ink='1'});
document.addEventListener('pointerup',()=>{drawing=null});
render();
})();
</script>
