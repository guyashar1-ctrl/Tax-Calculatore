<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בקשה אחת לתיק המס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink-1:#1c2330; --ink-2:#3b4452; --ink-3:#6b7482; --ink-4:#9aa3b0;
  --line:#e3e6ea; --line-2:#cfd4da; --accent:#3b5b8c; --accent-ink:#ffffff; --accent-soft:#e8eef7;
  --ok:#1f7a4d; --ok-soft:#e6f4ec; --warn:#9a6a12; --warn-soft:#fbf1dc; --bad:#b42318; --bad-soft:#fde8e6;
  --new:#5b3fb8; --new-soft:#ede8fb; --phone:#0e1117; --radius:12px; --fs:15px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1319; --card:#171c24; --ink-1:#eef1f5; --ink-2:#c9d0da; --ink-3:#98a2b0; --ink-4:#6c7684;
  --line:#242b36; --line-2:#333c49; --accent:#86a7dc; --accent-ink:#0f1319; --accent-soft:#1d2a3d;
  --ok:#5fc48f; --ok-soft:#14301f; --warn:#e0b65c; --warn-soft:#332a14; --bad:#f08a80; --bad-soft:#3a1a17;
  --new:#b39cf3; --new-soft:#272040; --phone:#000; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1319; --card:#171c24; --ink-1:#eef1f5; --ink-2:#c9d0da; --ink-3:#98a2b0; --ink-4:#6c7684;
  --line:#242b36; --line-2:#333c49; --accent:#86a7dc; --accent-ink:#0f1319; --accent-soft:#1d2a3d;
  --ok:#5fc48f; --ok-soft:#14301f; --warn:#e0b65c; --warn-soft:#332a14; --bad:#f08a80; --bad-soft:#3a1a17;
  --new:#b39cf3; --new-soft:#272040; --phone:#000; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink-1);font:var(--fs)/1.5 Heebo,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:52px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.3px}
.brand small{font-weight:400;color:var(--ink-3);margin-inline-start:8px}
.tabs{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
.tabs button{padding:8px 12px;border-radius:8px;color:var(--ink-3);font-weight:500}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.tabs button.cl{border:1px dashed var(--line-2)}
.wrap{max-width:1080px;margin:0 auto;padding-block:18px 60px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap>*{min-width:0}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;margin:22px 0 8px}
.lead{color:var(--ink-3);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .t{font-weight:600}
.row .s{color:var(--ink-3);font-size:13px}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.new{background:var(--new-soft);color:var(--new)} .chip.muted{background:var(--bg);color:var(--ink-3);border:1px solid var(--line)}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);font-weight:500;background:var(--card)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}
.btn:disabled{opacity:.5;cursor:default}
.kv{display:grid;grid-template-columns:150px 1fr auto;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--ink-3);font-size:14px}
.kv .v{min-width:0}
.kv .v b{font-weight:600}
.kv .src{font-size:12px;color:var(--ink-4);white-space:nowrap}
.kv.pending{background:var(--new-soft);margin:0 -16px;padding-inline:16px;border-top-color:transparent}
.kv .old{text-decoration:line-through;color:var(--ink-4);margin-inline-start:6px;font-size:13px}
.sec{font-size:13px;font-weight:600;color:var(--ink-3);margin:18px 0 6px;letter-spacing:.3px}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--new-soft);border:1px solid var(--new);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px}
.banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.banner.plain{background:var(--card);border-color:var(--line)}
.banner b{font-size:16px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.step .h{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.step ul{margin:6px 0 0;padding-inline-start:18px;color:var(--ink-2);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-4);display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.new{background:var(--new)}
.track{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-3)}
.track span{padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.track span.ok{color:var(--ok);border-color:var(--ok)} .track span.now{color:var(--accent);border-color:var(--accent);font-weight:600;background:var(--accent-soft)}
.sim{border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-3);margin-bottom:14px}
.sim b{color:var(--ink-1)}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink-1);color:var(--card);padding:8px 14px;border-radius:9px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.conf{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:8px 0}
.conf .o{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.conf .o button{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:6px 10px;font-size:14px}
.conf .o button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{font-size:13px;color:var(--ink-3);margin-top:6px}
/* phone */
.stage{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.phone{width:390px;max-width:100%;background:var(--phone);border-radius:34px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);flex:none}
.screen{background:var(--card);border-radius:24px;min-height:700px;display:flex;flex-direction:column;overflow:hidden;color:var(--ink-1)}
.ph-top{padding:14px 18px 8px;border-bottom:1px solid var(--line)}
.ph-top .b{font-size:12px;color:var(--ink-4)}
.ph-top h3{margin:2px 0 0;font-size:17px}
.ph-body{padding:16px 18px;flex:1}
.ph-body h4{font-size:19px;margin:0 0 6px;line-height:1.35;text-wrap:balance}
.ph-body .why{color:var(--ink-3);font-size:14px;margin:0 0 14px}
.ph-foot{padding:12px 18px 16px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
.ph-foot .btn.p{margin-inline-start:auto}
.prog{height:5px;background:var(--line);border-radius:3px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:.3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{border:1px solid var(--line-2);border-radius:12px;padding:12px 10px;text-align:center;font-weight:500;font-size:14px;line-height:1.3;background:var(--card)}
.tog .ic{display:block;font-size:20px;margin-bottom:4px}
.tog.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tog.wide{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chips button{border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;font-size:14px;background:var(--card)}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.lbl{font-size:13px;color:var(--ink-3);font-weight:600;margin:0 0 4px}
.list{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin:6px 0 14px}
.list button{display:flex;width:100%;text-align:start;padding:9px 12px;border-top:1px solid var(--line);font-size:15px;align-items:center;gap:10px}
.list button:first-child{border-top:0}
.list button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.list .srch{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--ink-4);font-size:14px}
.doc{border:1px dashed var(--line-2);border-radius:12px;padding:12px;margin:6px 0 10px}
.doc .n{font-weight:600;font-size:14px}
.doc .d{font-size:13px;color:var(--ink-3);margin:2px 0 8px}
.doc .a{display:flex;gap:8px;flex-wrap:wrap}
.doc.got{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.doc.later{border-color:var(--warn);background:var(--warn-soft)}
.fld{border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;margin:4px 0 12px;background:var(--card);color:var(--ink-1);font-size:15px;width:100%}
.ac{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin:-8px 0 12px}
.ac button{display:block;width:100%;text-align:start;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.known{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.known b{display:block;margin-bottom:4px}
.known ul{margin:0;padding-inline-start:18px;color:var(--ink-2)}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:44px}
.side{flex:1;min-width:260px}
.side .card{margin-bottom:10px}
.side ol,.side ul{padding-inline-start:18px;margin:6px 0;color:var(--ink-2)}
.side li{margin:3px 0}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:8px 0 14px}
.flow .f{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.flow .f b{display:block;font-size:14px}
.flow .f span{color:var(--ink-3);font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .card{margin:0}
.cmp h3{margin:0 0 6px;font-size:15px}
.cmp ul{margin:0;padding-inline-start:18px;color:var(--ink-2);font-size:14px}
.cmp li{margin:3px 0}
.q{border-inline-start:3px solid var(--accent);padding:6px 12px;margin:8px 0;background:var(--card);border-radius:0 8px 8px 0}
.q b{display:block}
.q span{color:var(--ink-2);font-size:14px}
.folder{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.folder:first-child{border-top:0}
.folder .f{font-weight:500}
.folder .f small{display:block;color:var(--ink-4);font-size:12px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{text-align:start;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
table.tb th{color:var(--ink-3);font-weight:600;font-size:13px}
table.tb tr:first-child th{border-top:0}
.tbwrap{overflow-x:auto}
@media (max-width:760px){
  .banner .grow,.row .s.grow,.row .t.grow{flex:1 1 100%}
  .banner>*,.row>*{min-width:0}
  .tabs{margin-inline-start:0}.tabs button{padding:6px 9px;font-size:14px}
  .top-in{padding-block:6px}
  .steps,.cmp{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv .src{white-space:normal}
  .phone{width:100%;padding:0;background:transparent;box-shadow:none;border-radius:0}
  .screen{border-radius:var(--radius);border:1px solid var(--line);min-height:0}
  .stage{flex-direction:column}
  table.tb{min-width:620px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">PIVO <small>רו״ח גיא ישר · דניאל ומיכל לוי</small></div>
  <nav class="tabs" id="tabs">
    <button data-v="requests">בקשות</button>
    <button data-v="taxfile">תיק מס</button>
    <button data-v="docs">מסמכים</button>
    <button data-v="client" class="cl">📱 הדף של דניאל ומיכל</button>
    <button data-v="principle">העיקרון</button>
  </nav>
</div></header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>
<script>
/* ───────────────── נתוני ההדמיה ───────────────── */
const PEOPLE = { client: 'דניאל', spouse: 'מיכל', both: 'שניכם' };
const ITEMS = {
  inv:      { t: 'תיק השקעות או פיקדון', ic: '📈', where: ['בנק הפועלים', 'בנק לאומי', 'בנק מזרחי-טפחות', 'בנק דיסקונט', 'IBI', 'מיטב', 'אלטשולר שחם', 'פסגות', 'Interactive Brokers'] },
  pension:  { t: 'פנסיה / קרן השתלמות שאתם מפקידים בעצמכם', ic: '🏦', where: ['מנורה מבטחים', 'הראל', 'כלל', 'מגדל', 'הפניקס', 'אלטשולר שחם', 'מיטב', 'מור'] },
  rent:     { t: 'דירה או נכס שאתם משכירים', ic: '🏠', where: null },
  crypto:   { t: 'מטבעות דיגיטליים', ic: '🪙', where: ['Bit2C', 'Binance', 'Coinbase', 'ארנק פרטי', 'אחר'] },
  foreign:  { t: 'חשבון, נכס או הכנסה בחו״ל', ic: '🌍', where: ['ארה״ב', 'בריטניה', 'גרמניה', 'קפריסין', 'אחר'] },
  allowance:{ t: 'קצבה (פנסיה, נכות, שארים) או דמי אבטלה', ic: '💶', where: ['ביטוח לאומי', 'קרן פנסיה', 'חברת ביטוח', 'משרד הביטחון'] },
  insurance:{ t: 'ביטוח חיים או אובדן כושר עבודה פרטי', ic: '🛡️', where: ['הראל', 'מגדל', 'כלל', 'הפניקס', 'מנורה', 'איילון'] },
  donations:{ t: 'תרומות', ic: '🎗️', where: null },
};
const ORDER = ['inv', 'pension', 'rent', 'crypto', 'foreign', 'allowance', 'insurance', 'donations'];
/* מסמכי הדוח השנתי — נגזרים ממה שבתיק אחרי האישור, כולל מה שיישור הקו מצא */
const ANNUAL_DOCS = [
  { id: 'd106a', who: 'מיכל', name: 'טופס 106 · קופת חולים מאוחדת', from: 'מהתיק', st: 'got' },
  { id: 'd106b', who: 'מיכל', name: 'טופס 106 · אלפא בע״מ (עד 03/2025)', from: 'מיישור הקו', st: 'got' },
  { id: 'd867',  who: 'דניאל', name: 'אישור שנתי 867 · IBI', from: 'מהתיק', st: 'later' },
  { id: 'dpen',  who: 'מיכל', name: 'אישור הפקדות · הראל', from: 'מהתיק', st: 'got' },
  { id: 'ddon',  who: 'שניכם', name: 'קבלות תרומה · 2025', from: 'מהתיק', st: 'got' },
  { id: 'dbiz',  who: 'דניאל', name: 'הכנסות והוצאות העסק · סטודיו לוי', from: 'מהתיק', st: 'got' },
];
const ANNUAL_NEW = { reserve: { t: 'שירות מילואים', ic: '🪖' }, birth: { t: 'לידה / דמי לידה', ic: '👶' }, sale: { t: 'מכרתם דירה או ניירות ערך', ic: '🏷️' }, alimony: { t: 'מזונות ששילמתם', ic: '⚖️' }, care: { t: 'קרוב במוסד סיעודי', ic: '🏥' }, abroad: { t: 'יותר מ-180 יום בחו״ל', ic: '✈️' } };
const WEALTH_BAL = [
  { id: 'wbank', name: 'בנק הפועלים · חשבון 154822', doc: 'אישור יתרה ליום 31.12.2025', st: 'got' },
  { id: 'winv',  name: 'IBI · תיק השקעות של דניאל', doc: 'תדפיס עלות (לא שווי) ליום 31.12.2025', st: 'got' },
  { id: 'wpen',  name: 'הראל · קרן השתלמות של מיכל', doc: 'אישור להצהרת הון ליום 31.12.2025', st: 'later' },
];
const WEALTH_NEW = { car: { t: 'רכב', ic: '🚗' }, loanIn: { t: 'הלוואה שלקחתם', ic: '🏦' }, loanOut: { t: 'הלוואה שנתתם', ic: '🤝' }, gift: { t: 'ירושה, מתנה או זכייה', ic: '🎁' }, prop: { t: 'דירה או נכס', ic: '🏠' }, jewel: { t: 'תכשיטים, זהב, אוספים', ic: '💍' } };

const S = {
  view: 'requests', cur: 'intake', step: 0,
  intake: 'sent',    // sent → answering → answered → approved
  annual: 'later',   // later → sent → answering → answered
  wealth: 'held',    // held → sent → answering → answered
  known: null, has: { inv: true, pension: true, donations: true }, noneTouched: false,
  d: { inv: { who: 'client', where: 'IBI' }, pension: { who: 'spouse', where: 'הראל' }, donations: { who: 'both' } },
  employer: { name: 'קופת חולים מאוחדת', when: 'all', more: 'no' },
  address: { street: 'הרצל 12', city: 'רעננה', zip: '4350401', picked: true },
  bank: { bank: 'בנק הפועלים', branch: '612', acct: '154822' },
  aChanged: null, aDocs: Object.fromEntries(ANNUAL_DOCS.map(d => [d.id, d.st])), aNew: { reserve: true }, aNewTouched: false,
  wDocs: Object.fromEntries(WEALTH_BAL.map(d => [d.id, d.st])), wNew: { car: true }, wNewTouched: false, wCash: '3,000',
  conflict: null, detail: false, approvedCount: 0,
};
const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); };
const noSim = () => toast('לא בהדגמה');
const go = (v) => { S.view = v; location.hash = v; render(); window.scrollTo(0, 0); };
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view) { S.view = v; render(); } });
const selected = () => ORDER.filter(k => S.has[k]);
const SECS = { family: 'משפחה וזהות', income: 'הכנסות', assets: 'השקעות, נכסים והפקדות', money: 'כספים ורשויות' };
const proposals = () => {
  const p = []; const L = (sec, k, v, src, old) => p.push({ sec, k, v, src, old });
  L('family', 'מצב משפחתי', 'נשואים מ-2016 · 2 ילדים', 'אישור הלקוח', null);
  L('family', 'כתובת', `${S.address.street}, ${S.address.city} · מיקוד ${S.address.zip}`, 'הלקוח', 'הרצל 12, רעננה (בלי מיקוד)');

      ${it.where ? `<p class="lbl">איפה?</p><div class="list"><div class="srch">🔍 חיפוש ברשימה</div>${it.where.slice(0, 6).map(w => `<button class="${d.where === w ? 'on' : ''}" onclick="setD('${st.k}','where','${w}')">${d.where === w ? '✓ ' : ''}${w}</button>`).join('')}<button onclick="toast('הרשימה המלאה — לא בהדגמה')">עוד…</button></div>` : '<p class="why">זה כל מה שצריך עכשיו. פרטים ומסמכים — כשנכין את הדוח.</p>'}`;

    canNext = S.wCash !== '';
  } else if (st.id === 'w-done') {
    body = `<div class="done"><div class="big">✅</div><h4>תודה.</h4><p class="why">נכין את ההצהרה ונשלח לכם לחתימה — כאן, בטלפון.</p><button class="btn p" onclick="finishWealth()">חזרה לדף שלי</button></div>`; foot = false;
  }
  const phone = `<div class="phone"><div class="screen">

    <div class="ph-body">${body}</div>
    ${foot ? `<div class="ph-foot">${i > 0 ? '<button class="btn link" onclick="prevStep()">הקודם</button>' : ''}<button class="btn link" onclick="toast(\'נשמר — אפשר לחזור מאותו קישור\');go(\'requests\')">שמירה ויציאה</button><button class="btn p" ${canNext ? '' : 'disabled'} onclick="nextStep()">${next}</button></div>` : ''}
  </div></div>`;
  const sideIntake = `<div class="card"><b>השלמת תיק המס — מה שונה מהיום</b><ol>
      <li>בלי מסמכים. רק תשובות: מה יש, של מי, איפה. מסמכים נבקשים כשמכינים דוח.</li>

      <li>כתובת עם מיקוד אוטומטי. תעודת זהות — כבר הגיעה בייצוג, לא שואלים שוב.</li></ol></div>`;
  const sideAnnual = `<div class="card"><b>דוח שנתי — למה זה קצר</b><ul>
      <li>שאלה אחת: «מה השתנה?». התיק כבר יודע את השאר.</li>
      <li>רשימת המסמכים נגזרת מהתיק — כולל מה שיישור הקו מצא (106 מאלפא). לא שואלים «האם יש לך 106».</li>
      <li>סכומים לא נשאלים: המשרד מזין מהמסמך, בליווי קובץ-קובץ.</li>

      <li>בסוף הלקוח חותם על עמוד סיכום עם השומה הצפויה. רק הוא.</li></ul></div>`;
  const sideWealth = `<div class="card"><b>הצהרת הון — למה זה קצר</b><ul>
      <li>נפתחת מיישור הקו (הדרישה נמצאה בשע״ם) — לא מהלקוח ולא מזיכרון של המשרד.</li>

function setKnown(v) { S.known = v; render(); }
function togHas(k) { S.has[k] = !S.has[k]; S.noneTouched = false; render(); }
function noneOf() { for (const k of ORDER) S.has[k] = false; S.noneTouched = true; render(); }
function setD(k, f, v) { (S.d[k] || (S.d[k] = {}))[f] = v; render(); }
function setEmpWhen(v) { S.employer.when = v; render(); }
function setEmpMore(v) { S.employer.more = v; if (v === 'yes') toast('מעסיק נוסף — אותם שדות (לא בהדמיה)'); render(); }
function pickAddr(s, c, z) { S.address = { street: s, city: c, zip: z, picked: true }; render(); }
function setAChanged(v) { S.aChanged = v; render(); }
function setADoc(id, v) { S.aDocs[id] = v; render(); }
function togANew(k) { S.aNew[k] = !S.aNew[k]; S.aNewTouched = false; render(); }
function noneANew() { for (const k in ANNUAL_NEW) S.aNew[k] = false; S.aNewTouched = true; render(); }
function setWDoc(id, v) { S.wDocs[id] = v; render(); }
function togWNew(k) { S.wNew[k] = !S.wNew[k]; S.wNewTouched = false; render(); }
function noneWNew() { for (const k in WEALTH_NEW) S.wNew[k] = false; S.wNewTouched = true; render(); }
function nextStep() { if (S.cur === 'intake' && S.intake === 'sent') S.intake = 'answering'; if (S.cur === 'annual' && S.annual === 'sent') S.annual = 'answering'; if (S.cur === 'wealth' && S.wealth === 'sent') S.wealth = 'answering'; S.step++; render(); window.scrollTo(0, 0); }
function prevStep() { S.step = Math.max(0, S.step - 1); render(); }
function finishIntake() { S.intake = 'answered'; S.step = 0; S.known = S.known || 'ok'; go('requests'); toast('הלקוח סיים · יישור הקו ברשויות רץ · 4 ממצאים'); }
function skipIntake() { S.known = S.known || 'ok'; S.intake = 'answered'; S.step = 0; go('requests'); toast('הלקוח סיים · יישור הקו ברשויות רץ · 4 ממצאים'); }
function finishAnnual() { S.annual = 'answered'; S.aChanged = S.aChanged || 'no'; S.step = 0; go('requests'); toast('הלקוח סיים — המסמכים בתיקיית הדוח'); }
function finishWealth() { S.wealth = 'answered'; S.step = 0; go('requests'); toast('הלקוח סיים — היתרות בתיקיית ההצהרה'); }
function resetSim() { Object.assign(S, { intake: 'sent', annual: 'later', wealth: 'held', step: 0, known: null, conflict: null, detail: false, approvedCount: 0, aChanged: null, cur: 'intake' }); render(); }

/* ───────────────── העיקרון ───────────────── */
function vPrinciple() {
  return `
  <h1>העיקרון: בקשה אחת, תשובות סגורות, אישור אחד</h1>
  <p class="lead">השלמת תיק המס, הדוח השנתי והצהרת ההון — אותה צורה. מה שמשתנה: אילו שאלות, אילו מסמכים, ומה המשרד עושה אחרי.</p>
  <div class="flow">
    <div class="f"><b>1 · שאלון קצר</b><span>רק מה שהתיק לא יודע. רשימות סגורות.</span></div>
    <div class="f"><b>2 · יישור קו ברשויות</b><span>רץ לבד כשהלקוח מסיים. עונה על מה שהלקוח לא יודע.</span></div>
    <div class="f"><b>3 · לתיק, ממתין לך</b><span>תשובות + ממצאי יישור הקו = עובדות «ממתין לאישורך».</span></div>
    <div class="f"><b>4 · אישור אחד</b><span>«אשר הכול». סתירה = בחירה בשורה, לא עצירה.</span></div>
    <div class="f"><b>5 · מסמכים רק כשצריך</b><span>בדוח ובהצהרה, לפי מה שבתיק. תזכורת אחת למה שחסר.</span></div>
  </div>

  <h2>תשובות לשאלות שלך</h2>
  <div class="q"><b>למה לבקש מסמכים בשאלון ההיכרות?</b><span>צודק — לא צריך. הורדתי: ההיכרות אוספת רק תשובות (מה יש, של מי, איפה). מסמכים מתבקשים כשיש מה לעשות איתם — בדוח השנתי ובהצהרת ההון — ורשימתם נגזרת מהתיק, לא מהלקוח. בהערכת מס גם לא מסמכים: רק מספרים. תעודת זהות כבר נאספת בייצוג, לא שואלים שוב.</span></div>
  <div class="q"><b>יישור קו ברשויות</b><span>צעד שני בכל בקשת תיק מס, רץ לבד כשהלקוח מסיים. הכפתור בכרטיס «זהות ורשויות» נשאר לרענון ידני — אותו מנגנון. אין מסך יישור קו נפרד.</span></div>
  <div class="q"><b>סתירה בין הלקוח לרשויות</b><span>נשאר כפי שראית: שורה אחת עם בחירה, ברירת מחדל «מה שברשויות», ו«אשר הכול» מאשר את השאר.</span></div>

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  const V = { requests: vRequests, taxfile: vTaxfile, docs: vDocs, client: vClient, principle: vPrinciple };
  document.getElementById('main').innerHTML = (V[S.view] || vRequests)();
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
S.view = ['requests', 'taxfile', 'docs', 'client', 'principle'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'requests';
render();
