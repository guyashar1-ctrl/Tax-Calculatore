# ═══════════════════════════════════════════════════════════════════════════
#  הגדרות פונקציות השרת
# ═══════════════════════════════════════════════════════════════════════════
#  verify_jwt קובע אם הפונקציה דורשת משתמש מחובר.
#  ברירת המחדל של ה-CLI היא true, ולכן חובה לרשום כאן במפורש את הפונקציות
#  הפתוחות — אחרת פרסום אוטומטי היה סוגר אותן ושובר את הדפים שהלקוחות פותחים
#  מקישור במייל (חתימה, שאלון, הצעת מחיר) ואת ה-webhook של Resend.
#  הערכים כאן תואמים למצב שהיה בפרודקשן ב-2026-07-26.
# ═══════════════════════════════════════════════════════════════════════════

project_id = "uoweoqtuiettozagwgdw"

# ── נקראות מקישור ציבורי שהלקוח מקבל, בלי התחברות ──────────────────────────
[functions.send-onboarding-email]
verify_jwt = false

[functions.send-quotation-email]
verify_jwt = false

[functions.send-release-email]
verify_jwt = false

[functions.signing-session]
verify_jwt = false

# קישור המילוי הציבורי הקבוע (?apply=) — הזיהוי הוא apply_token, לא JWT.
[functions.submit-application]
verify_jwt = false

# מופעלת גם מהדפדפן של הלקוח (עם טוקן ציבורי) וגם מהמערכת (עם JWT של הרו"ח).
# מזהה את הרו"ח בשני המסלולים בעצמה, ומחזירה מונה בלבד — בלי מידע.
[functions.notify-accountant]
verify_jwt = false

# ── נקראות ע"י שירותים חיצוניים / מתזמן, עם סוד משלהן ───────────────────────
[functions.resend-webhook]
verify_jwt = false

[functions.quotation-reminders]
verify_jwt = false

[functions.weekly-backup]
verify_jwt = false

# מיילים של שלבי הקליטה (הזמנה לפייפרלס, הרשאת תשלום, תזכורת). אין לה מסלול
# ציבורי — האימות נעשה בתוכה מה-JWT של הרו"ח, ובלעדיו היא מחזירה 401.
[functions.send-step-email]
verify_jwt = false

# מייל פתיחת התהליך ("פתחנו לך דף אישי"). אותו הסדר בדיוק: אין מסלול ציבורי,
# והאימות נעשה בתוכה מה-JWT של הרו"ח.
[functions.send-process-open-email]
verify_jwt = false

# שליחת קישור המילוי הציבורי במייל, ביוזמת הרו"ח. אין מסלול ציבורי — הטוקן
# מאומת מול הפרופיל של בעל ה-JWT, לא מתקבל כהרשאה.
[functions.send-apply-link-email]
verify_jwt = false

# שליחת דרישת תשלום עבור חיוב נוסף. אין מסלול ציבורי — מזוהה מה-JWT של הרו"ח,
# והחיוב נבדק ששייך לו לפני שהמייל יוצא.
[functions.send-charge-payment-request-email]
verify_jwt = false

# ── נקראת מתוך המערכת ע"י משתמש מחובר בלבד ─────────────────────────────────
[functions.ocr-document]
verify_jwt = true

[functions.backfill-email-html]
verify_jwt = false

# צילום התעודה בקליטת הייצוג. מסלול ציבורי — הלקוח מעלה מקישור הקליטה בלי
# התחברות, והזיהוי הוא טוקן הקליטה האקראי עצמו (כמו portal-upload-document).
[functions.onboarding-upload-id]
verify_jwt = false

# פתיחת מסמך פרטי שנשלח ללקוח, מהדף האישי. מסלול ציבורי — הזיהוי הוא טוקן הדף
# עצמו, והפונקציה חותמת קישור ל-5 דקות רק אחרי שווידאה שהמסמך אכן נשלח ללקוח
# הזה (מיגרציה 144). הקובץ עצמו נשאר ב-bucket הפרטי.
[functions.portal-open-document]
verify_jwt = false
